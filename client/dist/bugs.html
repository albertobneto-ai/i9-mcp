<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bug Tracker — Algar Telecom B2B</title>
<style>
:root{--black:#0A0A0A;--dark:#1E1E1E;--gray-d:#3A3A3A;--gray-m:#767676;--gray-s:#B0B0B0;--gray-l:#D4D4D2;--gray-bg:#EDEDEA;--ice:#F5F5F2;--white:#FFFFFF;--text:#1A1A1A;--green:#4A6A4A;--red:#8B4545;--blue:#456080;--amber:#7A6530;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter','Segoe UI',Arial,sans-serif;background:var(--gray-bg);color:var(--text);overflow-x:auto;}
/* ── HEADER ── */
.app-header{background:var(--black);color:var(--white);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;}
.app-header h1{font-size:15px;font-weight:600;letter-spacing:0.5px;}
.app-header h1 span{color:var(--gray-s);font-weight:400;}
.header-stats{display:flex;gap:16px;font-size:12px;color:var(--gray-s);}
.header-stats .hs{background:var(--dark);padding:4px 10px;border-radius:4px;}
.header-stats .hs b{color:var(--white);}
/* ── BOARD ── */
.board{display:flex;gap:8px;padding:12px;min-height:calc(100vh - 52px);align-items:flex-start;}
.column{min-width:220px;max-width:260px;flex:1;background:var(--ice);border-radius:8px;display:flex;flex-direction:column;max-height:calc(100vh - 64px);}
.col-header{padding:10px 12px;border-bottom:2px solid var(--black);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--ice);border-radius:8px 8px 0 0;z-index:2;}
.col-title{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gray-d);}
.col-count{font-size:11px;font-weight:700;background:var(--black);color:var(--white);padding:2px 8px;border-radius:10px;min-width:22px;text-align:center;}
.col-body{flex:1;overflow-y:auto;padding:6px 6px 12px 6px;min-height:60px;}
.col-body.dragover{background:var(--gray-l);}
/* ── CARD ── */
.card{background:var(--white);border:1px solid var(--gray-l);border-radius:6px;padding:10px;margin-bottom:6px;cursor:grab;transition:box-shadow 0.15s,transform 0.15s;position:relative;}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,0.12);}
.card.dragging{opacity:0.5;transform:rotate(1deg);}
.card-code{font-size:10px;font-weight:700;color:var(--gray-m);letter-spacing:0.5px;}
.card-title{font-size:11.5px;font-weight:600;color:var(--black);margin:4px 0 6px 0;line-height:1.35;}
.card-meta{display:flex;justify-content:space-between;align-items:center;font-size:9.5px;}
.card-obj{color:var(--gray-m);background:var(--gray-bg);padding:1px 6px;border-radius:3px;}
.card-effort{font-weight:700;color:var(--black);border:1px solid var(--gray-l);padding:1px 6px;border-radius:3px;}
.card-time{font-size:9px;color:var(--gray-m);margin-top:5px;display:flex;gap:8px;}
.card-time span b{color:var(--black);}
.card-blocked{margin-top:5px;font-size:9px;color:var(--red);font-weight:600;padding:2px 6px;border:1px dashed var(--red);border-radius:3px;display:inline-block;}
.badge-auto{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;border:1px solid var(--gray-l);}
.badge-sim{background:var(--green);}
.badge-parcial{background:var(--amber);}
.badge-nao{background:var(--red);}
/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:200;justify-content:center;align-items:flex-start;padding:40px 20px;overflow-y:auto;}
.modal-overlay.open{display:flex;}
.modal{background:var(--white);border-radius:10px;width:100%;max-width:680px;box-shadow:0 8px 40px rgba(0,0,0,0.3);}
.modal-head{background:var(--black);color:var(--white);padding:16px 20px;border-radius:10px 10px 0 0;display:flex;justify-content:space-between;align-items:center;}
.modal-head h2{font-size:14px;font-weight:600;}
.modal-head .close{background:none;border:none;color:var(--gray-s);font-size:22px;cursor:pointer;padding:0 4px;}
.modal-head .close:hover{color:var(--white);}
.modal-body{padding:20px;}
.modal-body .field{margin-bottom:14px;}
.modal-body .field label{display:block;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gray-m);margin-bottom:4px;}
.modal-body .field p,.modal-body .field pre{font-size:12px;line-height:1.5;color:var(--text);white-space:pre-wrap;word-break:break-word;}
.modal-body .field pre{background:var(--ice);padding:10px;border-radius:4px;border:1px solid var(--gray-l);font-family:inherit;}
.modal-status{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0;}
.modal-status button{font-size:10px;padding:5px 10px;border:1px solid var(--gray-l);border-radius:4px;background:var(--ice);cursor:pointer;color:var(--gray-d);font-weight:600;transition:all 0.15s;}
.modal-status button:hover{background:var(--gray-l);}
.modal-status button.active{background:var(--black);color:var(--white);border-color:var(--black);}
.time-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0;}
.time-cell{text-align:center;padding:8px;background:var(--ice);border-radius:4px;border:1px solid var(--gray-l);}
.time-cell.total{background:var(--black);border-color:var(--black);}
.time-cell .tc-lbl{font-size:8px;letter-spacing:0.5px;text-transform:uppercase;color:var(--gray-m);}
.time-cell.total .tc-lbl{color:var(--gray-s);}
.time-cell .tc-val{font-size:16px;font-weight:700;color:var(--black);margin-top:2px;}
.time-cell.total .tc-val{color:var(--white);}
/* ── SCROLLBAR ── */
.col-body::-webkit-scrollbar{width:4px;}
.col-body::-webkit-scrollbar-track{background:transparent;}
.col-body::-webkit-scrollbar-thumb{background:var(--gray-l);border-radius:4px;}
/* ── RESPONSIVE ── */
@media(max-width:900px){.board{flex-wrap:nowrap;overflow-x:auto;} .column{min-width:200px;}}
</style>
</head>
<body>
<div class="app-header">
  <h1>BUG TRACKER <span>— Algar Telecom B2B / CRM Salesforce</span></h1>
  <div class="header-stats" id="headerStats"></div>
</div>
<div class="board" id="board"></div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const API = '/api/bugs';
const COLS = [
  {key:'BACKLOG',label:'Backlog'},
  {key:'EM_ANALISE',label:'Em Análise'},
  {key:'EM_DESENVOLVIMENTO',label:'Em Desenvolvimento'},
  {key:'AGUARDANDO_DEPLOY',label:'Aguardando Deploy'},
  {key:'DEPLOY_EXECUTADO',label:'Deploy Executado'},
  {key:'CORRECAO_APLICADA',label:'Correção Aplicada'},
  {key:'AGUARDANDO_PASSOS_MANUAIS',label:'Passos Manuais'},
  {key:'EM_TESTES_UNITARIOS',label:'Testes Unitários'},
  {key:'EM_TESTES_FUNCIONAIS',label:'Testes Funcionais'},
  {key:'CONCLUIDO',label:'Concluído'}
];

let cards = [];
let dragId = null;

function fmtH(v){return v<1?(v*60).toFixed(0)+'m':parseFloat(v).toFixed(1)+'h';}

function badgeClass(claude){
  if(!claude) return 'badge-nao';
  const t=claude.toUpperCase();
  if(t.startsWith('SIM')) return 'badge-sim';
  if(t.includes('PARCIAL')) return 'badge-parcial';
  return 'badge-nao';
}

function renderBoard(){
  const board=document.getElementById('board');
  board.innerHTML='';
  const grouped={};
  COLS.forEach(c=>grouped[c.key]=[]);
  cards.forEach(c=>{
    const s=c.status||'BACKLOG';
    if(grouped[s])grouped[s].push(c); else grouped['BACKLOG'].push(c);
  });

  COLS.forEach(col=>{
    const items=grouped[col.key]||[];
    const colEl=document.createElement('div');
    colEl.className='column';
    colEl.innerHTML=`<div class="col-header"><span class="col-title">${col.label}</span><span class="col-count">${items.length}</span></div>`;
    const body=document.createElement('div');
    body.className='col-body';
    body.dataset.status=col.key;
    body.addEventListener('dragover',e=>{e.preventDefault();body.classList.add('dragover');});
    body.addEventListener('dragleave',()=>body.classList.remove('dragover'));
    body.addEventListener('drop',async e=>{
      e.preventDefault();body.classList.remove('dragover');
      if(!dragId) return;
      const newStatus=col.key;
      try{
        await fetch(API+'/'+dragId,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:newStatus})});
        const card=cards.find(c=>c.id==dragId);
        if(card) card.status=newStatus;
        renderBoard();
      }catch(err){console.error(err);}
      dragId=null;
    });
    items.forEach(c=>{
      const el=document.createElement('div');
      el.className='card';
      el.draggable=true;
      el.dataset.id=c.id;
      el.addEventListener('dragstart',()=>{dragId=c.id;el.classList.add('dragging');});
      el.addEventListener('dragend',()=>el.classList.remove('dragging'));
      el.addEventListener('click',()=>openModal(c));
      let blockedHtml=c.blocked?`<div class="card-blocked">&#128274; ${esc(c.blocked)}</div>`:'';
      el.innerHTML=`
        <div class="${'badge-auto '+badgeClass(c.claude_exec)}"></div>
        <div class="card-code">${esc(c.code)}</div>
        <div class="card-title">${esc(c.name)}</div>
        <div class="card-meta">
          <span class="card-obj">${esc(c.obj||'')}</span>
          <span class="card-effort">${esc(c.effort||'')}</span>
        </div>
        <div class="card-time">
          <span>Dev <b>${fmtH(c.dev_h)}</b></span>
          <span>Total <b>${fmtH(c.total_h)}</b></span>
        </div>
        ${blockedHtml}
      `;
      body.appendChild(el);
    });
    colEl.appendChild(body);
    board.appendChild(colEl);
  });
  updateStats(grouped);
}

function updateStats(grouped){
  const el=document.getElementById('headerStats');
  const total=cards.length;
  const done=(grouped['CONCLUIDO']||[]).length;
  const blocked=cards.filter(c=>c.blocked).length;
  const totalH=cards.reduce((s,c)=>s+parseFloat(c.total_h||0),0);
  el.innerHTML=`
    <div class="hs"><b>${total}</b> itens</div>
    <div class="hs"><b>${done}</b> concluídos</div>
    <div class="hs"><b>${blocked}</b> bloqueados</div>
    <div class="hs"><b>${fmtH(totalH)}</b> total</div>
  `;
}

function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function openModal(c){
  document.getElementById('modalTitle').textContent=c.code+' — '+c.name;
  const body=document.getElementById('modalBody');
  body.innerHTML=`
    <div class="time-grid">
      <div class="time-cell"><div class="tc-lbl">Dev</div><div class="tc-val">${fmtH(c.dev_h)}</div></div>
      <div class="time-cell"><div class="tc-lbl">Margem</div><div class="tc-val">+${fmtH(c.margin_h)}</div></div>
      <div class="time-cell"><div class="tc-lbl">Unit</div><div class="tc-val">${fmtH(c.unit_h)}</div></div>
      <div class="time-cell"><div class="tc-lbl">Func</div><div class="tc-val">${fmtH(c.func_h)}</div></div>
      <div class="time-cell total"><div class="tc-lbl">Total</div><div class="tc-val">${fmtH(c.total_h)}</div></div>
    </div>
    <div class="modal-status" id="modalStatusBtns"></div>
    <div class="field"><label>Objeto</label><p>${esc(c.obj)}</p></div>
    <div class="field"><label>Problema</label><pre>${esc(c.problem)}</pre></div>
    <div class="field"><label>Causa Raiz</label><pre>${esc(c.root_cause)}</pre></div>
    <div class="field"><label>Correção Técnica Proposta</label><pre>${esc(c.correction)}</pre></div>
    <div class="field"><label>Execução Claude</label><pre>${esc(c.claude_exec)}</pre></div>
    <div class="field"><label>Passo Manual</label><pre>${esc(c.manual_step)}</pre></div>
    ${c.blocked?'<div class="field"><label>Bloqueado por</label><p style="color:#8B4545;font-weight:700;">'+esc(c.blocked)+'</p></div>':''}
    ${c.notes?'<div class="field"><label>Notas</label><pre>'+esc(c.notes)+'</pre></div>':''}
  `;
  // Status buttons
  const btns=document.getElementById('modalStatusBtns');
  COLS.forEach(col=>{
    const btn=document.createElement('button');
    btn.textContent=col.label;
    if(c.status===col.key) btn.classList.add('active');
    btn.addEventListener('click',async()=>{
      try{
        await fetch(API+'/'+c.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:col.key})});
        c.status=col.key;
        renderBoard();
        btns.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
      }catch(err){console.error(err);}
    });
    btns.appendChild(btn);
  });
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(){document.getElementById('modalOverlay').classList.remove('open');}
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

async function loadCards(){
  try{
    const r=await fetch(API);
    if(!r.ok) throw new Error('API '+r.status);
    cards=await r.json();
    renderBoard();
  }catch(err){
    document.getElementById('board').innerHTML='<div style="padding:40px;color:#8B4545;font-size:14px;">Erro ao carregar cards. Execute <b>GET /api/bugs/init</b> e depois <b>POST /api/bugs/seed</b> para inicializar.</div>';
  }
}

// Auto-refresh every 30s
setInterval(loadCards, 30000);
loadCards();
</script>
</body>
</html>
