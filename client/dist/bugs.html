<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bug Tracker — Algar Telecom B2B</title>
<style>
:root{--black:#0A0A0A;--dark:#1E1E1E;--gray-d:#3A3A3A;--gray-m:#767676;--gray-s:#B0B0B0;--gray-l:#D4D4D2;--gray-bg:#EDEDEA;--ice:#F5F5F2;--white:#FFFFFF;--text:#1A1A1A;--green:#4A6A4A;--green-l:#6B8E6B;--red:#8B4545;--amber:#7A6530;--blue:#456080;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter','Segoe UI',Arial,sans-serif;background:var(--gray-bg);color:var(--text);overflow-x:auto;}
/* ── HEADER ── */
.app-header{background:var(--black);color:var(--white);padding:0 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;height:52px;}
.app-header h1{font-size:14px;font-weight:600;letter-spacing:0.5px;}
.app-header h1 span{color:var(--gray-s);font-weight:400;}
.header-right{display:flex;align-items:center;gap:16px;}
.header-stats{display:flex;gap:10px;font-size:11px;color:var(--gray-s);}
.header-stats .hs{background:var(--dark);padding:3px 9px;border-radius:4px;}
.header-stats .hs b{color:var(--white);}
/* ── TABS ── */
.tab-bar{display:flex;background:var(--dark);border-bottom:1px solid var(--gray-d);}
.tab-btn{padding:10px 24px;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--gray-s);cursor:pointer;border:none;background:transparent;border-bottom:3px solid transparent;transition:all 0.15s;}
.tab-btn:hover{color:var(--white);}
.tab-btn.active{color:var(--white);border-bottom-color:var(--white);background:var(--black);}
.tab-content{display:none;}
.tab-content.active{display:block;}
.timestamp{font-size:10px;color:var(--gray-m);}
/* ── DASHBOARD ── */
.dash{padding:0 16px 20px 16px;}
.dash-grid{display:grid;gap:10px;padding-top:12px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:1fr 1fr;}
.section-label{padding:12px 4px 0 4px;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray-m);}
/* KPI */
.kpi{background:var(--white);border-radius:10px;padding:18px;border:1px solid var(--gray-l);position:relative;overflow:hidden;}
.kpi.dark{background:var(--black);border-color:var(--black);}
.kpi-label{font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--gray-m);}
.kpi.dark .kpi-label{color:var(--gray-s);}
.kpi-value{font-size:34px;font-weight:700;color:var(--black);margin:4px 0 2px 0;line-height:1;}
.kpi.dark .kpi-value{color:var(--white);}
.kpi-sub{font-size:10px;color:var(--gray-m);}
.kpi.dark .kpi-sub{color:var(--gray-s);}
.kpi-icon{position:absolute;top:14px;right:16px;font-size:26px;opacity:0.1;}
.kpi.dark .kpi-icon{opacity:0.15;color:var(--white);}
.kpi-bar{margin-top:10px;height:5px;background:var(--gray-bg);border-radius:3px;overflow:hidden;}
.kpi.dark .kpi-bar{background:var(--gray-d);}
.kpi-bar-fill{height:100%;border-radius:3px;transition:width 0.8s ease;}
/* CHART CARD */
.chart-card{background:var(--white);border-radius:10px;padding:18px;border:1px solid var(--gray-l);}
.chart-card h3{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gray-d);margin-bottom:12px;}
/* HBAR */
.hbar-row{display:flex;align-items:center;margin-bottom:6px;font-size:10px;}
.hbar-label{width:130px;color:var(--gray-d);font-weight:500;text-align:right;padding-right:10px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hbar-track{flex:1;height:20px;background:var(--gray-bg);border-radius:4px;overflow:hidden;position:relative;}
.hbar-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:6px;font-size:9px;font-weight:700;color:var(--white);min-width:2px;transition:width 0.6s ease;}
.hbar-count{margin-left:6px;font-size:10px;color:var(--gray-m);font-weight:600;min-width:20px;}
/* DONUT */
.donut-wrap{display:flex;align-items:center;gap:20px;}
.donut-container{position:relative;width:140px;height:140px;flex-shrink:0;}
.donut-container svg{transform:rotate(-90deg);}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.donut-center .pct{font-size:28px;font-weight:700;color:var(--black);}
.donut-center .lbl{font-size:9px;color:var(--gray-m);text-transform:uppercase;letter-spacing:1px;}
.donut-legend{display:flex;flex-direction:column;gap:5px;}
.donut-legend .leg-item{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--gray-d);}
.donut-legend .leg-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
/* FORECAST */
.forecast-box{background:var(--black);border-radius:10px;padding:20px;display:flex;align-items:center;gap:20px;}
.forecast-icon{font-size:40px;opacity:0.15;color:var(--white);}
.forecast-content{flex:1;}
.fc-label{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gray-s);margin-bottom:3px;}
.fc-date{font-size:26px;font-weight:700;color:var(--white);line-height:1.2;}
.fc-sub{font-size:10px;color:var(--gray-s);margin-top:3px;}
.forecast-bars{display:flex;gap:10px;margin-top:10px;}
.forecast-bar{text-align:center;}
.forecast-bar .fb-val{font-size:16px;font-weight:700;color:var(--white);}
.forecast-bar .fb-lbl{font-size:7px;color:var(--gray-s);text-transform:uppercase;letter-spacing:0.5px;margin-top:1px;}
.forecast-bar .fb-bar{width:44px;height:4px;background:var(--gray-d);border-radius:2px;margin-top:3px;overflow:hidden;}
.forecast-bar .fb-fill{height:100%;border-radius:2px;}
/* BURNDOWN */
.burndown-chart{position:relative;height:160px;border-left:1px solid var(--gray-l);border-bottom:1px solid var(--gray-l);margin:6px 0 0 28px;}
.burndown-chart svg{width:100%;height:100%;}
.burn-labels{display:flex;justify-content:space-between;font-size:8px;color:var(--gray-m);margin:3px 0 0 28px;}
.burn-y{position:absolute;left:-26px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-between;font-size:8px;color:var(--gray-m);text-align:right;}
/* EFFORT TABLE */
.etbl{width:100%;border-collapse:collapse;margin-top:6px;}
.etbl th{font-size:8px;letter-spacing:0.8px;text-transform:uppercase;color:var(--gray-m);text-align:left;padding:5px 6px;border-bottom:2px solid var(--black);}
.etbl td{padding:5px 6px;font-size:10px;border-bottom:1px solid var(--gray-l);}
.etbl tr:hover td{background:var(--ice);}
.etbl .num{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;}
.etbl .bar-cell{width:100px;}
.mini-bar{height:7px;background:var(--gray-bg);border-radius:4px;overflow:hidden;}
.mini-fill{height:100%;border-radius:4px;}
/* AUTONOMY */
.auto-cards{display:flex;gap:10px;margin-bottom:12px;}
.auto-card{flex:1;text-align:center;padding:12px;background:var(--ice);border-radius:8px;}
.auto-card .av{font-size:26px;font-weight:700;}
.auto-card .al{font-size:8px;color:var(--gray-m);text-transform:uppercase;letter-spacing:1px;margin-top:3px;}
.auto-card .ap{font-size:9px;color:var(--gray-d);margin-top:1px;}
.stacked-bar{height:28px;display:flex;border-radius:6px;overflow:hidden;}
.stacked-bar div{display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--white);}
/* ── BOARD ── */
.board{display:flex;gap:6px;padding:10px;min-height:calc(100vh - 92px);align-items:flex-start;}
.column{min-width:195px;max-width:230px;flex:1;background:var(--ice);border-radius:8px;display:flex;flex-direction:column;max-height:calc(100vh - 100px);}
.col-header{padding:8px 10px;border-bottom:2px solid var(--black);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--ice);border-radius:8px 8px 0 0;z-index:2;}
.col-title{font-size:9px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--gray-d);}
.col-count{font-size:10px;font-weight:700;background:var(--black);color:var(--white);padding:1px 7px;border-radius:10px;min-width:20px;text-align:center;}
.col-body{flex:1;overflow-y:auto;padding:5px;min-height:50px;}
.col-body.dragover{background:var(--gray-l);}
.card{background:var(--white);border:1px solid var(--gray-l);border-radius:6px;padding:8px 10px;margin-bottom:5px;cursor:grab;transition:box-shadow 0.15s;position:relative;}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,0.1);}
.card.dragging{opacity:0.4;}
.card-code{font-size:9px;font-weight:700;color:var(--gray-m);letter-spacing:0.5px;}
.card-title{font-size:10.5px;font-weight:600;color:var(--black);margin:3px 0 5px 0;line-height:1.3;}
.card-meta{display:flex;justify-content:space-between;align-items:center;font-size:9px;}
.card-obj{color:var(--gray-m);background:var(--gray-bg);padding:1px 5px;border-radius:3px;}
.card-effort{font-weight:700;color:var(--black);border:1px solid var(--gray-l);padding:1px 5px;border-radius:3px;}
.card-time{font-size:8px;color:var(--gray-m);margin-top:4px;display:flex;gap:6px;}
.card-time span b{color:var(--black);}
.card-blocked{margin-top:4px;font-size:8px;color:var(--red);font-weight:600;padding:1px 5px;border:1px dashed var(--red);border-radius:3px;display:inline-block;}
.badge-auto{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;border:1px solid var(--gray-l);}
.badge-sim{background:var(--green);}.badge-parcial{background:var(--amber);}.badge-nao{background:var(--red);}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:200;justify-content:center;align-items:flex-start;padding:40px 20px;overflow-y:auto;}
.modal-overlay.open{display:flex;}
.modal{background:var(--white);border-radius:10px;width:100%;max-width:660px;box-shadow:0 8px 40px rgba(0,0,0,0.3);}
.modal-head{background:var(--black);color:var(--white);padding:14px 18px;border-radius:10px 10px 0 0;display:flex;justify-content:space-between;align-items:center;}
.modal-head h2{font-size:13px;font-weight:600;}
.modal-head .close{background:none;border:none;color:var(--gray-s);font-size:22px;cursor:pointer;padding:0 4px;}
.modal-head .close:hover{color:var(--white);}
.modal-body{padding:18px;}
.modal-body .field{margin-bottom:12px;}
.modal-body .field label{display:block;font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gray-m);margin-bottom:3px;}
.modal-body .field p,.modal-body .field pre{font-size:11px;line-height:1.5;color:var(--text);white-space:pre-wrap;word-break:break-word;}
.modal-body .field pre{background:var(--ice);padding:8px;border-radius:4px;border:1px solid var(--gray-l);font-family:inherit;}
.modal-status{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0;}
.modal-status button{font-size:9px;padding:4px 8px;border:1px solid var(--gray-l);border-radius:4px;background:var(--ice);cursor:pointer;color:var(--gray-d);font-weight:600;transition:all 0.15s;}
.modal-status button:hover{background:var(--gray-l);}
.modal-status button.active{background:var(--black);color:var(--white);border-color:var(--black);}
.time-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0;}
.time-cell{text-align:center;padding:8px;background:var(--ice);border-radius:4px;border:1px solid var(--gray-l);}
.time-cell.total{background:var(--black);border-color:var(--black);}
.tc-lbl{font-size:7px;letter-spacing:0.5px;text-transform:uppercase;color:var(--gray-m);}
.time-cell.total .tc-lbl{color:var(--gray-s);}
.tc-val{font-size:15px;font-weight:700;color:var(--black);margin-top:1px;}
.time-cell.total .tc-val{color:var(--white);}
.col-body::-webkit-scrollbar{width:3px;}.col-body::-webkit-scrollbar-track{background:transparent;}.col-body::-webkit-scrollbar-thumb{background:var(--gray-l);border-radius:3px;}
@media(max-width:1100px){.g4{grid-template-columns:1fr 1fr;}.g3{grid-template-columns:1fr;}.g2{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="app-header">
  <h1>BUG TRACKER <span>— Algar Telecom B2B / CRM Salesforce</span></h1>
  <div class="header-right">
    <div class="header-stats" id="headerStats"></div>
    <div class="timestamp" id="tsLabel"></div>
  </div>
</div>
<div class="tab-bar">
  <button class="tab-btn active" onclick="showTab('dashboard')">Dashboard</button>
  <button class="tab-btn" onclick="showTab('board')">Board</button>
</div>
<div class="tab-content active" id="tab-dashboard"><div class="dash" id="dashContent"><div style="padding:40px;color:var(--gray-m);">Carregando dashboard...</div></div></div>
<div class="tab-content" id="tab-board"><div class="board" id="board"></div></div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<script>
const API='/api/bugs';
const COLS=[
  {key:'BACKLOG',label:'Backlog',color:'var(--black)'},
  {key:'EM_ANALISE',label:'Em Análise',color:'var(--gray-d)'},
  {key:'EM_DESENVOLVIMENTO',label:'Em Desenv.',color:'var(--gray-d)'},
  {key:'AGUARDANDO_DEPLOY',label:'Aguard. Deploy',color:'var(--gray-m)'},
  {key:'DEPLOY_EXECUTADO',label:'Deploy Exec.',color:'var(--gray-m)'},
  {key:'CORRECAO_APLICADA',label:'Correção Aplic.',color:'var(--gray-s)'},
  {key:'AGUARDANDO_PASSOS_MANUAIS',label:'Passos Manuais',color:'var(--amber)'},
  {key:'EM_TESTES_UNITARIOS',label:'Testes Unit.',color:'var(--blue)'},
  {key:'EM_TESTES_FUNCIONAIS',label:'Testes Func.',color:'var(--blue)'},
  {key:'CONCLUIDO',label:'Concluído',color:'var(--green)'}
];
let cards=[],stats=null,dragId=null;
function fmtH(v){v=parseFloat(v)||0;return v<1?(v*60).toFixed(0)+'m':v.toFixed(1)+'h';}
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pct(a,b){return b>0?Math.round(a/b*100):0;}
function badgeClass(c){if(!c)return'badge-nao';const t=c.toUpperCase();if(t.startsWith('SIM'))return'badge-sim';if(t.includes('PARCIAL'))return'badge-parcial';return'badge-nao';}
function showTab(name){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase().includes(name)));document.querySelectorAll('.tab-content').forEach(t=>t.classList.toggle('active',t.id==='tab-'+name));}

// ══ DASHBOARD ══
function renderDash(s){
  if(!s)return;
  const t=s.total, d=s.done, donePct=pct(d.count,t.total);
  const remaining=parseFloat(s.hoursRemaining), consumed=parseFloat(s.hoursConsumed);
  const totalH=parseFloat(t.hours);
  const velocity=d.count>0?(consumed/d.count).toFixed(1):'—';
  // Forecast
  const daysLeft=remaining>0?(remaining/8).toFixed(1):'0';
  const today=new Date();
  const endDate=new Date(today);
  let bizDays=Math.ceil(parseFloat(daysLeft));
  let added=0;while(added<bizDays){endDate.setDate(endDate.getDate()+1);const dow=endDate.getDay();if(dow!==0&&dow!==6)added++;}
  const endStr=endDate.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}).replace('.','');
  // Status map
  const statusMap={};COLS.forEach(c=>statusMap[c.key]={count:0,hours:0});
  s.byStatus.forEach(r=>{if(statusMap[r.status])statusMap[r.status]={count:r.count,hours:parseFloat(r.hours)};});
  // Donut segments
  const dH=parseFloat(t.dev_h),mH=parseFloat(t.margin_h),uH=parseFloat(t.unit_h),fH=parseFloat(t.func_h);
  const circ=2*Math.PI*55;
  const seg=[dH,mH,uH,fH];const segC=['#3A3A3A','#767676','#B0B0B0','#D4D4D2'];
  let offset=0;
  const circles=seg.map((v,i)=>{const len=totalH>0?v/totalH*circ:0;const c=`<circle cx="70" cy="70" r="55" fill="none" stroke="${segC[i]}" stroke-width="18" stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-offset}"/>`;offset+=len;return c;}).join('');
  // Autonomy
  const autoMap={SIM:0,PARCIAL:0,NAO:0};s.byAutonomy.forEach(r=>autoMap[r.tipo]=r.count);
  // Section rows
  const secRows=s.bySection.map(r=>{const donePctS=pct(r.done,r.count);return`<tr><td>${esc(r.section)}</td><td>${r.count}</td><td class="num">${fmtH(r.hours)}</td><td class="bar-cell"><div class="mini-bar"><div class="mini-fill" style="width:${donePctS}%;background:var(--green);"></div></div></td><td class="num">${donePctS}%</td></tr>`;}).join('');
  // Status bars
  const maxCount=Math.max(...Object.values(statusMap).map(v=>v.count),1);
  const statusBars=COLS.map(c=>{const v=statusMap[c.key];const w=pct(v.count,maxCount);return`<div class="hbar-row"><div class="hbar-label">${c.label}</div><div class="hbar-track"><div class="hbar-fill" style="width:${Math.max(w,v.count>0?8:0)}%;background:${c.color};">${v.count>0?v.count:''}</div></div><div class="hbar-count">${v.count>0?fmtH(v.hours):''}</div></div>`;}).join('');
  // Burndown
  const burnW=400,burnH=150;
  const todayX=totalH>0?(consumed/totalH)*burnW:0;
  const todayY=totalH>0?(1-remaining/totalH)*burnH:0;

  document.getElementById('dashContent').innerHTML=`
  <div class="section-label">Indicadores Gerais</div>
  <div class="dash-grid g4">
    <div class="kpi dark"><div class="kpi-icon">📋</div><div class="kpi-label">Total de Bugs</div><div class="kpi-value">${t.total}</div><div class="kpi-sub">mapeados e classificados</div></div>
    <div class="kpi"><div class="kpi-icon">✅</div><div class="kpi-label">Concluídos</div><div class="kpi-value">${d.count}</div><div class="kpi-sub">de ${t.total} (${donePct}%)</div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:${donePct}%;background:var(--green);"></div></div></div>
    <div class="kpi"><div class="kpi-icon">⚡</div><div class="kpi-label">Em Progresso</div><div class="kpi-value">${s.inProgress}</div><div class="kpi-sub">análise + dev + deploy + testes</div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:${pct(s.inProgress,t.total)}%;background:var(--blue);"></div></div></div>
    <div class="kpi"><div class="kpi-icon">🔒</div><div class="kpi-label">Bloqueados</div><div class="kpi-value">${s.blocked}</div><div class="kpi-sub">aguardando decisão / artefato</div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:${pct(s.blocked,t.total)}%;background:var(--red);"></div></div></div>
  </div>
  <div class="section-label">Esforço e Previsão</div>
  <div class="dash-grid g2">
    <div class="chart-card"><h3>Distribuição de Esforço</h3>
      <div class="donut-wrap">
        <div class="donut-container"><svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="55" fill="none" stroke="#EDEDEA" stroke-width="18"/>${circles}</svg><div class="donut-center"><div class="pct">${fmtH(totalH)}</div><div class="lbl">Total</div></div></div>
        <div class="donut-legend">
          <div class="leg-item"><div class="leg-dot" style="background:#3A3A3A;"></div>Dev — ${fmtH(dH)}</div>
          <div class="leg-item"><div class="leg-dot" style="background:#767676;"></div>Margem — ${fmtH(mH)}</div>
          <div class="leg-item"><div class="leg-dot" style="background:#B0B0B0;"></div>Testes Unit. — ${fmtH(uH)}</div>
          <div class="leg-item"><div class="leg-dot" style="background:#D4D4D2;"></div>Testes Func. — ${fmtH(fH)}</div>
        </div>
      </div>
    </div>
    <div class="forecast-box">
      <div class="forecast-icon">📅</div>
      <div class="forecast-content">
        <div class="fc-label">Progresso Geral</div>
        <div class="fc-date" style="font-size:20px;">${d.count>0?'Velocidade: '+(consumed/d.count).toFixed(1)+'h/item':'Aguardando execução'}</div>
        <div class="forecast-bars">
          <div class="forecast-bar"><div class="fb-val">${fmtH(remaining)}</div><div class="fb-lbl">Restante</div><div class="fb-bar"><div class="fb-fill" style="width:${pct(remaining,totalH)}%;background:var(--gray-s);"></div></div></div>
          <div class="forecast-bar"><div class="fb-val">${fmtH(consumed)}</div><div class="fb-lbl">Consumido</div><div class="fb-bar"><div class="fb-fill" style="width:${pct(consumed,totalH)}%;background:var(--green-l);"></div></div></div>
          <div class="forecast-bar"><div class="fb-val">${s.unblocked}</div><div class="fb-lbl">Desbloq.</div><div class="fb-bar"><div class="fb-fill" style="width:${pct(s.unblocked,t.total)}%;background:var(--gray-s);"></div></div></div>
          <div class="forecast-bar"><div class="fb-val">${s.blocked}</div><div class="fb-lbl">Bloqueados</div><div class="fb-bar"><div class="fb-fill" style="width:${pct(s.blocked,t.total)}%;background:#8B4545;"></div></div></div>
        </div>
      </div>
    </div>
  </div>
  <div class="section-label">Pipeline e Projeção</div>
  <div class="dash-grid g2">
    <div class="chart-card"><h3>Distribuição por Status</h3>${statusBars}</div>
    <div class="chart-card"><h3>Burndown — Horas Restantes</h3>
      <div class="burndown-chart" style="margin-left:28px;">
        <div class="burn-y"><span>${fmtH(totalH)}</span><span>${fmtH(totalH*0.75)}</span><span>${fmtH(totalH*0.5)}</span><span>${fmtH(totalH*0.25)}</span><span>0h</span></div>
        <svg viewBox="0 0 ${burnW} ${burnH}" preserveAspectRatio="none">
          <line x1="0" y1="${burnH*0.25}" x2="${burnW}" y2="${burnH*0.25}" stroke="#EDEDEA" stroke-width="1"/>
          <line x1="0" y1="${burnH*0.5}" x2="${burnW}" y2="${burnH*0.5}" stroke="#EDEDEA" stroke-width="1"/>
          <line x1="0" y1="${burnH*0.75}" x2="${burnW}" y2="${burnH*0.75}" stroke="#EDEDEA" stroke-width="1"/>
          <line x1="0" y1="0" x2="${burnW}" y2="${burnH}" stroke="#D4D4D2" stroke-width="1.5" stroke-dasharray="6,4"/>
          <polyline points="0,0 ${todayX},${todayY}" fill="none" stroke="#0A0A0A" stroke-width="2.5"/>
          <polyline points="${todayX},${todayY} ${burnW},${burnH}" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-dasharray="4,3"/>
          <line x1="${todayX}" y1="0" x2="${todayX}" y2="${burnH}" stroke="#8B4545" stroke-width="1" stroke-dasharray="3,3"/>
          <text x="${todayX+4}" y="10" font-size="8" fill="#8B4545" font-family="Arial">HOJE</text>
        </svg>
      </div>
      <div class="burn-labels"><span>Início</span><span>25%</span><span>50%</span><span>75%</span><span>Fim</span></div>
      <div style="margin-top:6px;display:flex;gap:16px;font-size:9px;color:var(--gray-m);"><span>—— Realizado</span><span style="color:var(--gray-l);">- - - Ideal</span><span style="color:var(--gray-d);">- - - Projetado</span></div>
    </div>
  </div>
  <div class="section-label">Detalhamento por Área</div>
  <div class="dash-grid g2">
    <div class="chart-card"><h3>Esforço por Área</h3>
      <table class="etbl"><tr><th>Área</th><th>Itens</th><th class="num">Horas</th><th class="bar-cell">Progresso</th><th class="num">%</th></tr>${secRows}
      <tr style="font-weight:700;"><td>Total</td><td>${t.total}</td><td class="num">${fmtH(totalH)}</td><td class="bar-cell"><div class="mini-bar"><div class="mini-fill" style="width:${donePct}%;background:var(--black);"></div></div></td><td class="num">${donePct}%</td></tr></table>
    </div>
    <div class="chart-card"><h3>Autonomia de Execução</h3>
      <div class="auto-cards">
        <div class="auto-card"><div class="av" style="color:var(--green);">${autoMap.SIM}</div><div class="al">Claude</div><div class="ap">${pct(autoMap.SIM,t.total)}%</div></div>
        <div class="auto-card"><div class="av" style="color:var(--amber);">${autoMap.PARCIAL}</div><div class="al">Parcial</div><div class="ap">${pct(autoMap.PARCIAL,t.total)}%</div></div>
        <div class="auto-card"><div class="av" style="color:var(--red);">${autoMap.NAO}</div><div class="al">Manual</div><div class="ap">${pct(autoMap.NAO,t.total)}%</div></div>
      </div>
      <div class="stacked-bar">
        <div style="width:${pct(autoMap.SIM,t.total)}%;background:var(--gray-d);">${autoMap.SIM>0?autoMap.SIM+' autônomo':''}</div>
        <div style="width:${pct(autoMap.PARCIAL,t.total)}%;background:var(--gray-m);"></div>
        <div style="width:${pct(autoMap.NAO,t.total)}%;background:var(--gray-s);"></div>
      </div>
    </div>
  </div>
  <div class="section-label">Performance</div>
  <div class="dash-grid g3">
    <div class="kpi"><div class="kpi-label">Velocidade Média</div><div class="kpi-value" style="font-size:26px;">${velocity}</div><div class="kpi-sub">${velocity!=='—'?'horas/item':'calculado após primeiras entregas'}</div></div>
    <div class="kpi"><div class="kpi-label">Tempo Médio por Item</div><div class="kpi-value" style="font-size:26px;">${fmtH(s.avgPerItem)}</div><div class="kpi-sub">dev + margem + testes</div></div>
    <div class="kpi"><div class="kpi-label">Itens sem Bloqueio</div><div class="kpi-value" style="font-size:26px;">${s.unblocked}</div><div class="kpi-sub">prontos para execução imediata</div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:${pct(s.unblocked,t.total)}%;background:var(--green);"></div></div></div>
  </div>
  `;
}

// ══ BOARD ══
function renderBoard(){
  const board=document.getElementById('board');board.innerHTML='';
  const grouped={};COLS.forEach(c=>grouped[c.key]=[]);
  cards.forEach(c=>{const s=c.status||'BACKLOG';if(grouped[s])grouped[s].push(c);else grouped['BACKLOG'].push(c);});
  COLS.forEach(col=>{
    const items=grouped[col.key]||[];
    const colEl=document.createElement('div');colEl.className='column';
    colEl.innerHTML=`<div class="col-header"><span class="col-title">${col.label}</span><span class="col-count">${items.length}</span></div>`;
    const body=document.createElement('div');body.className='col-body';body.dataset.status=col.key;
    body.addEventListener('dragover',e=>{e.preventDefault();body.classList.add('dragover');});
    body.addEventListener('dragleave',()=>body.classList.remove('dragover'));
    body.addEventListener('drop',async e=>{e.preventDefault();body.classList.remove('dragover');if(!dragId)return;
      try{await fetch(API+'/'+dragId,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:col.key})});const card=cards.find(c=>c.id==dragId);if(card)card.status=col.key;renderBoard();loadStats();}catch(err){console.error(err);}dragId=null;});
    items.forEach(c=>{
      const el=document.createElement('div');el.className='card';el.draggable=true;el.dataset.id=c.id;
      el.addEventListener('dragstart',()=>{dragId=c.id;el.classList.add('dragging');});
      el.addEventListener('dragend',()=>el.classList.remove('dragging'));
      el.addEventListener('click',()=>openModal(c));
      const bh=c.blocked?`<div class="card-blocked">🔒 ${esc(c.blocked)}</div>`:'';
      el.innerHTML=`<div class="${'badge-auto '+badgeClass(c.claude_exec)}"></div><div class="card-code">${esc(c.code)}</div><div class="card-title">${esc(c.name)}</div><div class="card-meta"><span class="card-obj">${esc(c.obj||'')}</span><span class="card-effort">${esc(c.effort||'')}</span></div><div class="card-time"><span>Dev <b>${fmtH(c.dev_h)}</b></span><span>Total <b>${fmtH(c.total_h)}</b></span></div>${bh}`;
      body.appendChild(el);});
    colEl.appendChild(body);board.appendChild(colEl);});
}

// ══ HEADER STATS ══
function updateHeader(){
  if(!stats)return;
  const el=document.getElementById('headerStats');
  const s=stats;
  el.innerHTML=`<div class="hs"><b>${s.total.total}</b> itens</div><div class="hs"><b>${s.done.count}</b> concluídos</div><div class="hs"><b>${s.blocked}</b> bloqueados</div><div class="hs"><b>${fmtH(s.hoursRemaining)}</b> restantes</div>`;
  document.getElementById('tsLabel').textContent='Atualizado: '+new Date().toLocaleString('pt-BR');
}

// ══ MODAL ══
function openModal(c){
  document.getElementById('modalTitle').textContent=c.code+' — '+c.name;
  const body=document.getElementById('modalBody');
  body.innerHTML=`
    <div class="time-grid">
      <div class="time-cell"><div class="tc-lbl">Dev</div><div class="tc-val">${fmtH(c.dev_h)}</div></div>
      <div class="time-cell"><div class="tc-lbl">Margem</div><div class="tc-val">+${fmtH(c.margin_h)}</div></div>
      <div class="time-cell"><div class="tc-lbl">Unit</div><div class="tc-val">${fmtH(c.unit_h)}</div></div>
      <div class="time-cell"><div class="tc-lbl">Func</div><div class="tc-val">${fmtH(c.func_h)}</div></div>
      <div class="time-cell total"><div class="tc-lbl">Total</div><div class="tc-val">${fmtH(c.total_h)}</div></div>
    </div>
    <div class="modal-status" id="modalStatusBtns"></div>
    <div class="field"><label>Objeto</label><p>${esc(c.obj)}</p></div>
    <div class="field"><label>Problema</label><pre>${esc(c.problem)}</pre></div>
    <div class="field"><label>Causa Raiz</label><pre>${esc(c.root_cause)}</pre></div>
    <div class="field"><label>Correção Técnica</label><pre>${esc(c.correction)}</pre></div>
    <div class="field"><label>Execução Claude</label><pre>${esc(c.claude_exec)}</pre></div>
    <div class="field"><label>Passo Manual</label><pre>${esc(c.manual_step)}</pre></div>
    ${c.blocked?'<div class="field"><label>Bloqueado por</label><p style="color:#8B4545;font-weight:700;">'+esc(c.blocked)+'</p></div>':''}
    ${c.notes?'<div class="field"><label>Notas</label><pre>'+esc(c.notes)+'</pre></div>':''}`;
  const btns=document.getElementById('modalStatusBtns');
  COLS.forEach(col=>{const btn=document.createElement('button');btn.textContent=col.label;if(c.status===col.key)btn.classList.add('active');
    btn.addEventListener('click',async()=>{try{await fetch(API+'/'+c.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:col.key})});c.status=col.key;renderBoard();loadStats();btns.querySelectorAll('button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}catch(err){console.error(err);}});
    btns.appendChild(btn);});
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');}
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

// ══ DATA LOADING ══
async function loadCards(){try{const r=await fetch(API);cards=await r.json();renderBoard();}catch(e){console.error(e);}}
async function loadStats(){try{const r=await fetch(API+'/stats');stats=await r.json();renderDash(stats);updateHeader();}catch(e){console.error(e);}}
async function loadAll(){await Promise.all([loadCards(),loadStats()]);}
setInterval(loadAll,30000);
loadAll();
</script>
</body>
</html>
