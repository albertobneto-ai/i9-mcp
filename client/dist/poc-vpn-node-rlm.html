<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Salesforce · VPN Node · Lightning Experience</title>
<style>
:root{--brand:#0176d3;--navy:#032d60;--bd:#e5e5e5;--bd2:#c9c9c9;--tx:#181818;--tx2:#444;--mut:#706e6b;--err:#ba0517;--warn:#fe9339;--warnt:#8c4b02;--ok:#2e844a;--gray:#f3f3f3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[onclick],[onchange]{cursor:pointer}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Salesforce Sans",Arial,sans-serif;font-size:15px;color:var(--tx);background:#fff}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
#poc{background:#16325c;color:#cfe0f5;font-size:11px;padding:6px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#poc b{color:#9fc3ee;letter-spacing:.06em;text-transform:uppercase;font-size:9.5px}
#poc .sim{color:#9fc3ee;margin-left:6px;text-transform:uppercase;letter-spacing:.05em;font-size:9.5px}
#poc button:disabled{border-color:#3f5b8a;color:#8aa5cc}
#poc select{background:#fff;color:#181818;border:0;border-radius:3px;padding:2px 4px;font-size:11px;max-width:150px}
#poc button{background:0;border:1px solid #6d8cc0;color:#fff;border-radius:3px;padding:2px 8px;font-size:11px}
#guia{position:fixed;left:0;right:0;bottom:118px;max-width:430px;margin:0 auto;padding:0 12px;z-index:26;display:none}
#guia.show{display:block}
#guia .g-body{background:#fff;border:1px solid #fadfa4;border-left:4px solid #fe9339;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.18);padding:10px 12px;font-size:13px;line-height:1.4;color:#3e3e3c;max-height:56vh;overflow:auto}
#guia .g-top{display:flex;align-items:flex-start;gap:10px}
#guia .g-ic{font-size:16px;flex:none;line-height:1.3}
#guia .g-txt{flex:1}
#guia .g-txt b{color:#8c4b02}
#guia .g-x{flex:none;border:0;background:0;color:var(--mut);font-size:15px;padding:0 2px;line-height:1}
#guia .g-passos{display:none}
#guia.open .g-passos{display:block;margin:8px 0 0 4px}
#guia .g-passos ol{margin:0;padding-left:20px}
#guia .g-passos li{margin:5px 0;color:#444}
#guia .g-acts{display:flex;gap:8px;align-items:center;margin-top:9px}
#guia .g-exp{border:1px solid var(--bd2);background:#fff;color:var(--brand);border-radius:16px;padding:7px 12px;font-size:12px;font-weight:600}
#guia .g-go{margin-left:auto;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:16px;padding:7px 14px;font-size:12px;font-weight:600}
#guia .g-go.hide{display:none}
#guia-abrir{position:fixed;right:12px;bottom:124px;z-index:26;display:none;width:44px;height:44px;border-radius:50%;border:1px solid #fadfa4;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.2);font-size:19px}
#guia-abrir.show{display:block}
#app{max-width:430px;margin:0 auto;min-height:100vh;position:relative;background:#fff;padding-bottom:128px}
.sb{height:22px;display:flex;justify-content:space-between;padding:3px 14px;font-size:11px}
.top{display:flex;align-items:center;padding:8px 12px;gap:8px;min-height:44px}
.top .bk{color:var(--brand);font-size:15px;background:0;border:0;padding:4px 0}
.top .ttl{flex:1;text-align:center;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ic{color:var(--brand);font-size:18px;background:0;border:0}
.acts{display:flex;justify-content:space-around;padding:10px 6px 8px;border-bottom:1px solid var(--bd)}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--tx2);background:0;border:0;width:78px}
.act i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-size:17px}
i.b,.oi.b{background:#1b96ff}i.t,.oi.t{background:#0b827c}i.g,.oi.g{background:#2e844a}i.m,.oi.m{background:#747474}i.o,.oi.o{background:#f88962}i.p,.oi.p{background:#7f8de1}i.r,.oi.r{background:#ba0517}i.y,.oi.y{background:#ff9e2c}
.rh{background:var(--gray);padding:14px;display:flex;gap:12px;align-items:flex-start}
.rh .oi{width:34px;height:34px;border-radius:5px;display:grid;place-items:center;color:#fff;font-size:17px;flex:none}
.rh small{display:block;font-size:14px;color:var(--tx2)}
.rh b{font-size:19px;line-height:1.25;display:block}
.fl{padding:0 14px}
.fr{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--bd);font-size:15px;align-items:flex-start}
.fr span:first-child{width:120px;flex:none}
.fr span:last-child{flex:1}
.chk{width:16px;height:16px;border:1px solid var(--bd2);border-radius:3px;display:inline-block}
.pathw{background:var(--gray);padding:12px 0 0;margin-top:8px}
.path{display:flex;gap:3px;overflow-x:auto;padding:0 12px}
.ps{flex:none;width:118px;background:#fff;font-size:14px;text-align:center;padding:10px 6px 10px 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%)}
.ps:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);border-radius:20px 0 0 20px}
.ps.cur{background:var(--navy);color:#fff}.ps.done{background:var(--ok);color:#fff}.ps.sel{outline:2px solid var(--brand);outline-offset:-2px}
.stage{text-align:center;font-weight:700;padding:10px 12px 12px;background:var(--gray);font-size:15px}
.stage .btn{margin-top:8px;flex:none;width:100%}
.rtabs{display:flex;border-bottom:1px solid var(--bd);margin-top:6px}
.rtabs a{flex:1;text-align:center;padding:12px 6px;color:var(--tx);border-bottom:3px solid transparent;margin-bottom:-1px;font-size:14px}
.rtabs a.on{border-color:var(--brand);font-weight:700;color:var(--navy)}
.rel{margin:12px 14px;border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.rel .h{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--bd)}
.rel .h .oi{width:28px;height:28px;border-radius:4px;display:grid;place-items:center;color:#fff;font-size:13px;flex:none}
.rel .h b{flex:1}.rel .h a{font-size:14px}
.rel .it{padding:11px 12px;border-bottom:1px solid var(--bd);font-size:14px}
.rel .it b{display:block;color:var(--brand)}.rel .it small{color:var(--tx2)}
.rel .rfoot{padding:10px;text-align:center;font-size:14px}
.rel .note{padding:10px 12px;font-size:12.5px;color:var(--mut);background:#fafaf9;line-height:1.4}
#atd{position:fixed;right:12px;bottom:176px;z-index:25;display:none;align-items:center;gap:8px;padding:9px 14px;border-radius:22px;font-size:13px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.22);max-width:86%;cursor:pointer}
#atd.show{display:inline-flex}
#atd small{display:block;font-weight:400;font-size:11px;opacity:.9;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#atd.Formatado{background:#ebf7e6;color:#1d6b38;border:1px solid #b6e3c2}
#atd.Customizado{background:#fef3d7;color:#8c4b02;border:1px solid #fadfa4}
#atd.Inviável{background:#fef1ee;color:#ba0517;border:1px solid #f9c9c0}
#atd.Pendente{background:#f3f3f3;color:#444;border:1px solid var(--bd2)}
#atd i{font-style:normal;font-size:15px}
.agent{position:fixed;left:0;right:0;bottom:64px;max-width:430px;margin:0 auto;padding:0 14px 6px;z-index:20}
.agent div{background:#f3f3f3;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;color:#444;font-size:17px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.agent .afi{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;background:#fff;border:1px solid var(--bd2);color:#032d60;font-size:12px;font-weight:700}
.agent .afi.has{background:0;border:0}
.agent .afi img{width:100%;height:100%;object-fit:contain;display:none}
.agent .afi.has img{display:block}.agent .afi.has span{display:none}
.agent .mic{margin-left:auto;font-size:20px;color:#444}
.agent .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);margin-left:-6px;margin-top:-18px}
#agp{position:fixed;left:0;right:0;top:var(--poch,0px);bottom:0;background:#fff;z-index:70;display:none;flex-direction:column;max-width:430px;margin:0 auto}
#agp.show{display:flex}
.agp-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--bd)}
.agp-h b{font-size:18px;flex:1;font-weight:600}
.agp-h .afi-h{width:26px;height:26px;flex:none;display:grid;place-items:center;overflow:hidden;font-size:10.5px;font-weight:700;color:#032d60}
.agp-h .afi-h img{width:100%;height:100%;object-fit:contain;display:none}
.agp-h .afi-h.has img{display:block}.agp-h .afi-h.has span{display:none}
.agp-h .ic{width:26px;height:26px;border-radius:50%;background:#ecebea;color:#706e6b;display:grid;place-items:center;font-size:12px;border:0}
.agp-h .ic.av{background:#032d60;color:#fff;overflow:hidden}.agp-h .ic.av img{width:100%;height:100%;object-fit:cover;display:none}.agp-h .ic.av.has img{display:block}.agp-h .ic.av.has span{display:none}
.agp-b{flex:1;overflow:auto;background:linear-gradient(180deg,#f7f5fb 0%,#f1f0fa 40%,#ffffff 100%);padding:0 0 12px}
.welcome{margin:14px;background:#f5f7fb;border:1px solid #e3e8f0;border-radius:12px;padding:16px;display:flex;gap:14px;align-items:flex-start}
.welcome .bot{width:64px;height:64px;border-radius:50%;background:#fff;border:1px solid #d8e0ea;display:grid;place-items:center;flex:none;overflow:hidden;padding:7px}
.welcome .bot img{width:100%;height:100%;object-fit:contain;display:none}.welcome .bot.has img{display:block}.welcome .bot.has svg{display:none}
.welcome p{margin:0;font-size:16px;line-height:1.5}
.sugg{display:flex;flex-direction:column;gap:8px;margin:2px 14px 10px}
.sugg button{display:flex;align-items:center;gap:10px;border:1px solid #d6dbe3;background:#fff;border-radius:8px;padding:12px 14px;font-size:15px;text-align:left;color:var(--tx)}
.sugg button.pri{border-color:var(--brand)}
.sugg button i{color:var(--brand);font-style:normal;font-size:15px;flex:none}
.datebox{display:flex;gap:8px;align-items:center}
.datebox input{flex:1;border:1px solid var(--bd2);border-radius:8px;padding:11px 12px;min-height:44px;background:#fff;font-size:15px}
.agp-hero{padding:34px 24px 10px;text-align:center}
.agp-hero .orb{width:210px;height:210px;border-radius:50%;margin:0 auto 18px;background:radial-gradient(circle at 30% 30%,#e9e4f8,#b9b3ea 60%,#8f8fe0);display:grid;place-items:center;overflow:hidden;position:relative}
.agp-hero .orb img{width:100%;height:100%;object-fit:cover;display:none}.agp-hero .orb.has img{display:block}.agp-hero .orb.has .ph{display:none}
.agp-hero .orb .ph{color:#fff;font-size:13px;line-height:1.4;padding:0 26px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.agp-hero h2{margin:0 0 8px;font-size:22px;font-weight:700}
.agp-hero p{margin:0;font-size:14.5px;color:var(--tx2);line-height:1.5}
.msg-a,.msg-u{max-width:86%;margin:10px 14px;padding:10px 14px;border-radius:14px;font-size:14.5px;line-height:1.45;white-space:pre-wrap}
.msg-a{background:#fff;border:1px solid var(--bd);border-top-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.msg-u{background:var(--brand);color:#fff;margin-left:auto;border-top-right-radius:4px}
.msg-a .src{display:block;font-size:11px;color:var(--mut);margin-top:6px}
.msg-a .porque{display:block;margin-top:6px;padding-left:9px;border-left:3px solid #e5e5e5;color:var(--tx2);font-size:12.5px;line-height:1.4}
.sugg button .tag{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--ok);background:#ebf7e6;border-radius:10px;padding:1px 7px;flex:none}
.revc{margin-top:8px;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.revc .rh2{background:var(--gray);padding:7px 10px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--mut)}
.revc .rr{display:flex;gap:10px;padding:6px 10px;border-top:1px solid var(--bd);font-size:12.5px}
.revc .rr span:first-child{flex:none;width:46%;color:var(--tx2)}
.revc .rr span:last-child{flex:1;font-weight:600}
.revc .rb{padding:6px 10px;border-top:1px solid var(--bd);font-size:12.5px}
.msg-a.think{color:var(--mut);font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 14px 6px}
.chips button{border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:18px;padding:8px 14px;font-size:14px;max-width:100%;text-align:left}
.chips button.pri{background:var(--brand);color:#fff}
.agp-f{border-top:1px solid var(--bd);padding:10px 14px 14px;background:#fff}
.agp-f .box{border:1px solid var(--bd2);border-radius:8px;min-height:64px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between}
.agp-f textarea{border:0;outline:0;resize:none;font-size:15px;min-height:26px;width:100%}
.agp-f .send{align-self:flex-end;background:0;border:0;color:var(--brand);font-size:22px;padding:0;transform:rotate(-20deg)}
.agp-f .send.off{color:#c9c9c9}
.bnav{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;background:#fff;border-top:1px solid var(--bd);display:flex;height:64px;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;background:0;border:0;color:var(--tx2);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.bnav button i{font-style:normal;font-size:20px;line-height:1;color:#444}
.bnav button.on{color:var(--brand);font-weight:700}.bnav button.on i{color:var(--brand)}
.form-h{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bd)}
.form-h a{width:70px;font-size:16px}.form-h b{flex:1;text-align:center;font-size:16px}.form-h a.sv{text-align:right;font-weight:700}
.ff{padding:12px 14px;border-bottom:1px solid var(--bd)}
.ff label{display:block;font-size:13px;color:var(--tx2);margin-bottom:6px}
.ff label .rq{color:var(--err)}
.ff input,.ff select,.ff textarea{width:100%;border:1px solid var(--bd2);border-radius:6px;padding:11px 12px;min-height:44px;background:#fff;font-size:15px}
.ff textarea{min-height:90px}
.ff .pill{display:inline-flex;align-items:center;gap:6px;background:#e5f1fb;border-radius:14px;padding:4px 10px;font-size:14px}
.ff .sec{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.bsheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
.bsheet{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;background:#fff;border-radius:14px 14px 0 0;z-index:41;padding-bottom:env(safe-area-inset-bottom);max-height:86vh;overflow:auto}
.bsheet .grip{width:36px;height:4px;background:var(--bd2);border-radius:2px;margin:8px auto}
.bsheet .row{display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid var(--bd);font-size:16px}
.bsheet .row i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;flex:none;font-size:15px}
.bsheet .row.dis{color:#a8a8a8}.bsheet .row.dis i{opacity:.4}
.bsheet .cancel{text-align:center;padding:14px;color:var(--brand);font-size:16px}
.bsheet .nvt{font-size:11px;color:var(--warnt);background:#fef3d7;border-radius:4px;padding:1px 6px;margin-left:auto}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end}
.modal{background:#fff;width:100%;max-width:430px;margin:0 auto;border-radius:14px 14px 0 0;max-height:88vh;overflow:auto}
.modal h3{margin:0;padding:16px;text-align:center;font-size:17px;border-bottom:1px solid var(--bd)}
.modal .mb{padding:12px 16px}
.modal .mf{display:flex;gap:10px;padding:12px 16px 18px;border-top:1px solid var(--bd)}
.radio{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--bd);border-radius:8px;margin-bottom:8px}
.radio input{width:18px;height:18px;accent-color:var(--brand)}
.btn{border:1px solid var(--bd2);background:#fff;color:var(--brand);border-radius:8px;padding:11px 16px;font-size:15px;min-height:44px;flex:1}
.btn.brand{background:var(--brand);border-color:var(--brand);color:#fff}
.btn[disabled]{background:#c9c9c9;border-color:#c9c9c9;color:#fff}
.btn.sm{padding:7px 12px;min-height:36px;font-size:13px;flex:none}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#2e844a;color:#fff;padding:12px 18px;border-radius:8px;z-index:60;font-size:14px;max-width:88%}
.toast.warn{background:#8c4b02}
.nv-tag{margin:8px 14px 0;font-size:11px;color:var(--warnt);background:#fef3d7;border:1px solid #fadfa4;border-radius:6px;padding:6px 10px;line-height:1.4}
.fnt{margin:8px 14px 0;font-size:11px;line-height:1.45;border-radius:6px;padding:6px 10px;display:flex;gap:7px;align-items:flex-start}
.fnt .tg{flex:none;font-weight:700;letter-spacing:.03em;font-size:9.5px;text-transform:uppercase;border-radius:3px;padding:1px 5px;margin-top:1px}
.fnt.ver{background:#ebf7e6;border:1px solid #b6e3c2;color:#1d6b38}
.fnt.ver .tg{background:#1d6b38;color:#fff}
.fnt.inf{background:#eef2fb;border:1px solid #c9d6ef;color:#2b4a80}
.fnt.inf .tg{background:#2b4a80;color:#fff}
.fnt.nv{background:#fef3d7;border:1px solid #fadfa4;color:#8c4b02}
.fnt.nv .tg{background:#8c4b02;color:#fff}
.fnt.proto{background:#f3f3f3;border:1px solid var(--bd2);color:#444}
.fnt.proto .tg{background:#706e6b;color:#fff}
.proc small{display:block;margin-top:2px}
.hgrid{display:grid;grid-template-columns:1fr;gap:0}
.rpt{background:#fff;border:1px solid var(--bd);border-radius:6px;margin:12px 14px 0;overflow:hidden}
.rpt .rh2{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--bd)}
.rpt .rh2 b{font-size:14px;flex:1}
.rpt .rh2 .sub{color:var(--mut);font-size:11.5px}
.rpt .filtros{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;background:var(--gray);border-bottom:1px solid var(--bd);font-size:12px;align-items:center}
.rpt .filtros select{border:1px solid var(--bd2);border-radius:4px;padding:4px 6px;font-size:12px;background:#fff}
.rpt table{width:100%;border-collapse:collapse;font-size:12.5px}
.rpt th{background:#f7f8fa;text-align:left;font-weight:700;color:#33475b;padding:8px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
.rpt td{padding:7px 12px;border-bottom:1px solid #eef1f5}
.rpt tr.grp td{background:#eef2f7;font-weight:700;color:#0b5cab}
.rpt tr.tot td{background:#f7f8fa;font-weight:700}
.rpt td.n,.rpt th.n{text-align:right}
.rpt .vazio{padding:14px;color:var(--mut);font-size:12.5px}
.dashg{display:grid;grid-template-columns:1fr;gap:0}
.dash{background:#fff;border:1px solid var(--bd);border-radius:6px;margin:12px 14px 0}

.dash .body{padding:12px 14px}
.dash .leg{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11.5px;color:var(--tx2)}
.dash .leg i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px}
.rptlink{color:var(--brand);font-size:12px}
.tle-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--bd)}

/* Home em duas colunas, como no Lightning */
.hgrid{grid-template-columns:1fr 380px;gap:0 16px}
.hgrid>div{min-width:0}
/* página do Customer Asset em duas colunas, como na captura oficial */
.acols{grid-template-columns:1fr 380px}
.ahl{margin:0;border-radius:6px 6px 0 0}
.ahl .l1 b{font-size:22px}
.rtabs{border-radius:0}
.kpis{padding:14px 0 0}
.chartc,.ovw,.accord{margin:14px 0 0}
.acols>div:first-child{min-width:0}
/* área de conteúdo */
#view{max-width:1280px;margin:0 auto;padding:14px 16px 0}
.top{background:0;padding:0 0 8px;min-height:0;border:0}
.top .ttl{text-align:left;font-size:13px;color:var(--mut);font-weight:400}
.top .bk,.top .ic{display:none}
/* cabeçalho do registro (highlights panel) */
.rh{background:#fff;border:1px solid var(--bd);border-bottom:0;border-radius:6px 6px 0 0;padding:14px 18px;margin:0;align-items:center}
.rh .oi{width:38px;height:38px;border-radius:6px;font-size:19px}
.rh b{font-size:21px}
.rh small{font-size:12px;color:var(--mut)}
.acts{justify-content:flex-end;gap:8px;padding:10px 18px;background:#fff;border:1px solid var(--bd);border-top:0;border-bottom:1px solid var(--bd);margin:0;position:relative;top:-1px}
.act{flex-direction:row;width:auto;gap:7px;border:1px solid var(--bd2);border-radius:4px;padding:6px 12px;font-size:13px;color:var(--brand);background:#fff}
.act:hover{background:#f4f6f9}
.act i{width:18px;height:18px;font-size:11px;border-radius:3px}
/* abas do registro */
.rtabs{background:#fff;border:1px solid var(--bd);border-top:0;margin:0;padding:0 10px}
.rtabs a{flex:none;padding:11px 16px;font-size:14px}
/* campos em duas colunas */
.fl{background:#fff;border:1px solid var(--bd);border-top:0;border-radius:0 0 6px 6px;padding:12px 18px 18px;display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.fr{padding:9px 0;font-size:13.5px;align-items:baseline}
.fr span:first-child{width:auto;flex:0 0 42%;color:var(--mut);font-size:12.5px}
.lsec{background:0;border-bottom:1px solid var(--bd);grid-column:1/-1;margin:10px 0 2px;padding:0 0 6px;font-size:12px}
/* path */
.pathw{background:#fff;border:1px solid var(--bd);border-top:0;padding:14px 18px;margin:0}
.path{padding:0;gap:4px}
.ps{width:auto;flex:1;min-width:0;font-size:13px;padding:9px 8px 9px 20px}
.stage{background:0;display:flex;align-items:center;justify-content:space-between;padding:12px 0 0;font-size:14px}
.stage .btn{width:auto;flex:none;margin:0}
/* listas relacionadas em cartões, duas colunas */
.rel{margin:14px 0 0;background:#fff;border:1px solid var(--bd);border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.rel .h{padding:12px 16px;font-size:15px}
.rel .it{padding:10px 16px;font-size:13.5px}
.rel .it:hover{background:#f4f6f9}
.rel .note,.rel .rfoot{font-size:12.5px}
#view .relcols{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:start}
/* TLE e linhas */
.tle-h,.tle-tools,.bp-top,.bp-head,.cfg-top,.mtabs,.atabs,.selbar,.cats,.srch,.form-h,.fl-prog{background:#fff}
.tle-h{border:1px solid var(--bd);border-bottom:0;border-radius:6px 6px 0 0;margin-top:14px;padding:12px 16px}
.tle-tools{border-left:1px solid var(--bd);border-right:1px solid var(--bd);padding:10px 16px;gap:8px}
.tle-tools .btn{flex:none}
.line{border-left:1px solid var(--bd);border-right:1px solid var(--bd);padding:12px 16px}
.line:last-of-type{border-bottom:1px solid var(--bd);border-radius:0 0 6px 6px}
.line .kv{grid-template-columns:repeat(3,1fr);font-size:12.5px}
/* catálogo em grade */
#view .prowgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 0 12px}
.prow{margin:0}
.foot{position:static;max-width:1280px;margin:14px auto 0;background:0;border:0;padding:0 16px;justify-content:flex-end}
.foot .btn{flex:none;min-width:140px}
/* configurador em duas colunas */
#view .cfgwrap{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
.fld{padding:10px 0 0}
#view .cfgfields{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.sum{margin:0;position:sticky;top:104px}
.grp2{margin:18px 0 0}
.ccard{background:#fff}
.ph,.cfg-info,.mrow,.qty-r{background:#fff}
.ph,.cfg-top{border:1px solid var(--bd);border-bottom:0}
.cfg-top{border-radius:6px 6px 0 0;margin-top:4px}
.mtabs,.mrow,.cfg-info,.ph,.qty-r,.atabs{border-left:1px solid var(--bd);border-right:1px solid var(--bd)}
.atabs{padding:0 16px}
/* formulários e modais */
.form-h{max-width:760px;margin:0 auto;border:1px solid var(--bd);border-bottom:0;border-radius:6px 6px 0 0;padding:14px 18px}
.form-h b{font-size:17px}
.ff{max-width:760px;margin:0 auto;border-left:1px solid var(--bd);border-right:1px solid var(--bd);padding:12px 18px}
.ff:last-of-type{border-bottom:1px solid var(--bd);border-radius:0 0 6px 6px}
.modal{max-width:560px;border-radius:8px;margin:auto}
.modal-bg{align-items:center;padding:24px}
.bsheet{max-width:420px;left:auto;right:24px;bottom:auto;top:96px;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.bsheet .grip{display:none}
.bsheet-bg{background:rgba(0,0,0,.15)}
/* Agentforce ancorado à direita */
.agent{display:none!important}
#lx .icons .agbtn{border:0;background:0;padding:0;width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
#lx .icons .agbtn:hover{background:#f4f6f9}
#lx .icons .agbtn img{width:24px;height:24px;object-fit:contain;display:block}
#agp{left:auto;right:0;top:var(--poch,0px);bottom:0;width:400px;max-width:400px;margin:0;border-left:1px solid var(--bd);box-shadow:-2px 0 10px rgba(0,0,0,.08);z-index:35}
#agp .agp-h{padding:16px}
/* utility bar do Lightning */
#ub{position:fixed;left:0;right:0;bottom:0;height:36px;background:#fff;border-top:1px solid var(--bd);display:flex;align-items:center;gap:0;z-index:32;padding-left:8px}
#ub button{border:0;background:0;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--tx);padding:0 14px;height:36px;border-right:1px solid var(--bd)}
#ub button:hover{background:#f4f6f9}
#ub .sp{margin-left:auto;color:var(--mut);font-size:11.5px;padding-right:14px}
/* roteiro e atendimento no desktop */
#guia{left:auto;right:16px;bottom:52px;max-width:420px;padding:0}
body.agp-open #guia{right:416px}
#atd{right:16px;bottom:calc(52px + 74px)}
body.agp-open #atd{right:416px}
#guia-abrir{right:16px;bottom:52px}
body.agp-open #guia-abrir{right:416px}
#poc{position:sticky;top:0;z-index:40}
.fnt,.nv-tag{margin:10px 0 0}
.toast{top:auto;bottom:56px;left:auto;right:16px;transform:none}

const ATTRS = {"Velocidade": {"code": "ATTR001", "name": "Velocidade", "type": "Picklist", "obg": true, "ui": "picklist", "values": ["10 Mbps", "20 Mbps", "30 Mbps", "50 Mbps", "100 Mbps", "200 Mbps", "300 Mbps", "400 Mbps", "500 Mbps", "700 Mbps", "900 Mbps", "1 Gbps", "1.2 Gbps", "1.5 Gbps", "2 Gbps", "2.5 Gbps", "3 Gbps", "3.5 Gbps", "4 Gbps", "4.5 Gbps", "5 Gbps", "5.5 Gbps", "6 Gbps", "6.5 Gbps", "7 Gbps", "7.5 Gbps", "8 Gbps", "8.5 Gbps", "9 Gbps", "9.5 Gbps", "10 Gbps", "15 Gbps", "20 Gbps", "25 Gbps", "30 Gbps", "40 Gbps", "50 Gbps", "60 Gbps", "70 Gbps", "80 Gbps", "90 Gbps", "100 Gbps", "200Gbps", "300Gbps", "400Gbps", "500Gbps", "600Gbps", "700Gbps"], "def": null, "unit": null, "help": "A velocidade não pode ser alterada enquanto o cliente possuir o SVA de aumento temporário ativo.", "duvida": "", "pend": "", "ro": false, "uc": 2}, "Tecnologia": {"code": "ATTR002", "name": "Tecnologia", "type": "Picklist", "obg": true, "ui": "picklist", "values": ["Metro", "GPON", "XGSPON", "Rádio"], "def": null, "unit": null, "help": "O campo não é solicitado ao usuário: é preenchido automaticamente com o retorno da análise de viabilidade e, em esteira formatada, não é editado. Passa a ser editável — pelo usuário com permissão de complementação técnica — quando o retorno da viabilidade é manual ou quando a configuração segue fluxo de processo customizável.", "duvida": "", "pend": "", "ro": false, "uc": 5}, "Interface": {"code": "ATTR003", "name": "Interface", "type": "Picklist", "obg": true, "ui": "picklist", "values": ["Óptica", "Elétrica"], "def": "Elétrica (esteira formatada)", "unit": null, "help": "O campo não é solicitado ao usuário: é preenchido automaticamente com o retorno da análise de viabilidade e, em esteira formatada, não é editado. Passa a ser editável — pelo usuário com permissão de complementação técnica — quando o retorno da viabilidade é manual ou quando a configuração segue fluxo de processo customizável.", "duvida": "", "pend": "", "ro": false, "uc": 6}, "Abordagem": {"code": "ATTR004", "name": "Abordagem", "type": "Picklist", "obg": true, "ui": "picklist", "values": ["Pronta", "Construir"], "def": null, "unit": null, "help": "Preenchido com o retorno da análise de viabilidade. — A edição é restrita ao usuário com permissão de complementação técnica, ou aos casos em que a configuração atende aos critérios de produto não formatado. Se o retorno indicar rede neutra, o atendimento é inviável.", "duvida": "", "pend": "", "ro": false, "uc": 7}, "Metragem": {"code": "ATTR005", "name": "Metragem", "type": "Number", "obg": true, "ui": "number", "values": [], "def": null, "unit": "m", "help": "Preenchido com o retorno da análise de viabilidade. — No preenchimento automático com abordagem Construir, a própria análise de viabilidade retorna a metragem. No preenchimento manual, o valor deve ser maior que zero e é obrigatório somente quando a abordagem é Construir. Em projetos customizados, o campo é editável pelo usuário com permissão de complementação técnica.", "duvida": "", "pend": "", "ro": false, "uc": 8}, "VPNNetwork": {"code": "ATTR006", "name": "VPN Network", "type": "Lookup", "obg": true, "ui": "network", "values": [], "def": null, "unit": null, "help": "Ao preencher este campo, o usuário escolhe entre selecionar uma network existente — o sistema apresenta a lista das networks ativas vinculadas ao CNPJ raiz — ou criar uma nova no mesmo fluxo, quando não existe network ativa ou quando os nodes contratados serão associados a uma rede nova. Na criação, o protocolo de roteamento é informado obrigatoriamente e, concluída a criação, o sistema gera o ide", "duvida": "", "pend": "", "ro": false, "uc": 3}, "ProtocoloRoteamento": {"code": "ATTR007", "name": "Protocolo de Roteamento", "type": "Picklist", "obg": true, "ui": "picklist", "values": ["RIP", "STATIC", "BGP", "eBGP"], "def": "RIP", "unit": null, "help": "Valor padrão: RIP. — O atributo pertence à VPN Network: é definido no nível da rede e herdado pelos nodes. Só é const vazio = v => v===undefined || v===null || v==='' || v===false;

/* resolve os atributos que o produto herda da classificação, com as sobrescritas */
function resolveAttrs(prod){
  const cls = CLASSES.find(c => c.code===prod.cls); if(!cls) return [];
  const out=[], seen=new Set();
  cls.cats.forEach(cc => {
    const cat = ATTR_CATS.find(x=>x.code===cc); if(!cat) return;
    cat.attrs.forEach(code => {
      if(seen.has(code) || !ATTRS[code]) return; seen.add(code);
      const d = ATTRS[code], o = (cls.over||{})[code] || {};
      out.push(Object.assign({}, d, o, { key:code, cat:cat.name, catCode:cat.code, camada:cat.camada, hidden:!!o.hidden }));
    });
  });
  return out;
}
function visibleAttrs(prod){ return resolveAttrs(prod).filter(a=>!a.hidden); }
function isConfigurable(prod){ return visibleAttrs(prod).length>0; }
function usoDoAtributo(code){ return CLASSES.filter(c => c.cats.some(cc => (ATTR_CATS.find(x=>x.code===cc)||{attrs:[]}).attrs.includes(code))); }
function classOf(prod){ return CLASSES.find(c=>c.code===prod.cls); }

/* Elegibilidade comercial do produto: regras de conta + território da localidade.
   Avaliada por item (por node), não pela cotação — RN-ELG-02. */
function qualificadoProduto(prod, loc){
  const hits = QUALIF.filter(q => evalExpr(q.quando, {})).slice();
  const ter = TERRITORIOS_PRODUTO[prod.id];
  const L = loc || CTX.localidade;
  if(ter && L && ter.indexOf(L.territorio) === -1)

      motivo: prod.name+' não é elegível em '+L.nome+' — território '+L.territorio+'. Elegível em: '+ter.join(' e ')+'.' });
  return { ok:hits.length===0, hits };
}

function classificar(cfg){
  const e = CTX.endereco, env = { a:cfg.a, c:cfg.c };
  if(e.cobertura===false || e.redeNeutra) return { v:'Inviável', motivos:[e.cobertura===false?'Sem cobertura no endereço':'Rede neutra'] };
  const mot = CLASSIF.customizacao.filter(([x]) => evalExpr(x, env)).map(x=>x[1]);
  if(mot.length) return { v:'Customizado', motivos:mot };
  if(!cfg.a.Velocidade || !cfg.a.Tecnologia) return { v:'Pendente', motivos:['Informe a velocidade para classificar o atendimento'] };
  const m = CLASSIF.matriz.find(([x]) => evalExpr(x, env));
  return m ? { v:'Formatado', motivos:[m[1]] } : { v:'Customizado', motivos:['Nenhum critério da matriz de formatação atendido'] };
}
function resolveRef(cfg, key){
  if(key.includes('#')){ const [cp, rest] = key.split('#'); const [i, attr] = rest.split('.'); return [(cfg.c[cp]||[])[Number(i)], attr]; }
  return [cfg.a, key];
}
function avaliar(cfg){
  const R = { hidden:{}, disabled:{}, required:{}, hideVals:{}, msgs:[], excl:{}, ferr:{} };
  for(let pass=0; pass<2; pass++){
    const d = { classificacao: classificar(cfg).v };
    REGRAS.forEach(r => r.efeitos.forEach(e => {
      if(e.tipo==='setValue' && !e.componente && evalExpr(e.quando, {a:cfg.a,c:cfg.c,d})){
        const val = evalExpr(e.valor, {a:cfg.a,c:cfg.c,d}); if(val===undefined||val===null) return;
        if(e.forcar || (e.soVazio ? vazio(cfg.a[e.alvo]) : !cfg.toque[e.alvo])) cfg.a[e.alvo] = val;
      }
      if(e.tipo==='autoAdd' && evalExpr(e.quando, {a:cfg.a,c:cfg.c,d})){
        const sig = (cfg.a.Tecnologia||'')+'|'+(CTX.endereco.anel?1:0);
        if(cfg.autoSig !== sig){ const itens = evalExpr(e.itens, {a:cfg.a,c:cfg.c,d}) || [];
          cfg.c[e.componente] = (cfg.c[e.componente]||[]).filter(i=>!i.auto).concat(itens); cfg.autoSig = sig; }
      }
    }));
  }
  const cls = classificar(cfg); R.cls = cls; const d = { classificacao: cls.v };
  const t = { nodesNovaNetwork: lines.filter(l => l.attrs && l.attrs['VPN Network']==='NOVA').length + (cfg.a.VPNNetwork==='NOVA'?1:0) };
  REGRAS.forEach(r => r.efeitos.forEach(e => {
    const itens = e.componente ? (cfg.c[e.componente]||[]) : null;
    const alvos = e.componente
      ? (itens.length ? itens.map((x,i)=>({key:e.componente+'#'+i+'.'+e.alvo, x}))
                      : (e.tipo==='exclude' ? [{ key:e.componente, x:{} }] : []))   /* exclusão vale antes de existir item */
      : [{ key:e.alvo, x:{} }];
    alvos.forEach(({key,x}) => {
      const env = { a:cfg.a, c:cfg.c, d, x, t };
      if(!evalExpr(e.quando, env)) return;
      if(e.tipo==='hide') R.hidden[key]=r.id;
      else if(e.tipo==='disable') R.disabled[key]=r.id;
      else if(e.tipo==='require') R.required[key]=r.id;
      else if(e.tipo==='hideValues'){ const at=ATTRS[e.alvo]; (at? at.values:[]||[]).forEach(v => {
          if(evalExpr(e.filtro, Object.assign({}, env, {v}))) (R.hideVals[key]=R.hideVals[key]||{})[v]=r.id; }); }
      else if(e.tipo==='message'){ if(!e.componente || (cfg.c[e.componente]||[]).length){
          let txt = e.texto;
          if(txt === '__FALTANDO__'){ const falta = F.equipamentosFaltando(cfg.a.Tecnologia, CTX.endereco.anel, cfg.c.equip||[]);
            txt = `Tecnologia ${cfg.a.Tecnologia}${CTX.endereco.anel?' com entrega em anel':''} exige ${falta.join(' e ')} — inclua no grupo Equipamentos de Acesso.`; }
          R.msgs.push({sev:e.severidade, texto:txt, regra:r.id}); } }
      else if(e.tipo==='constraint'){ R.ferr[key]=e.texto; R.msgs.push({sev:e.severidade||'Error', texto:e.texto, regra:r.id}); }
      else if(e.tipo==='exclude'){ R.excl[e.componente]={texto:e.texto, regra:r.id};
        if((cfg.c[e.componente]||[]).length) R.msgs.push({sev:'Error', texto:e.texto, regra:r.id}); }
      else if(e.tipo==='transacao') R.msgs.push({sev:e.severidade, texto:e.texto, regra:r.id});
    });
  }));
  Object.entries(R.hideVals).forEach(([key,vals]) => { const [obj,attr]=resolveRef(cfg,key); if(obj && vals[obj[attr]]) obj[attr]=''; });
  Object.keys(R.required).forEach(key => {
    if(R.hidden[key]) return; const [obj,attr]=resolveRef(cfg,key); if(!obj) return;
    if(vazio(obj[attr])){ R.ferr[key]=R.ferr[key]||'Preencha este campo.';
      R.msgs.push({sev:'Error', texto:'Atributo obrigatório sem valor: '+(ATTRS[attr]?ATTRS[attr].name:attr), regra:R.required[key]}); }
  });
  const seen=new Set(); R.msgs = R.msgs.filter(m => { const k=m.sev+m.texto; if(seen.has(k)) return false; seen.add(k); return true; });
  const ord={Error:0,Warning:1,Info:2}; R.msgs.sort((a,b)=>ord[a.sev]-ord[b.sev]);
  return R;
}

function barrasSvg(pares, titulo){
  const max = Math.max(1, ...pares.map(p=>p[1]));
  const W=560, lh=26, H=pares.length*lh+18;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${pares.map(([n,v],i)=>{ const w=(W-200)*(v/max);
      return `<g>
        <text x="0" y="${i*lh+16}" font-size="11.5" fill="#3e3e3c">${esc(String(n).slice(0,26))}</text>
        <rect x="170" y="${i*lh+5}" width="${Math.max(2,w)}" height="14" rx="3" fill="${CORES[i%CORES.length]}"/>
        <text x="${175+Math.max(2,w)}" y="${i*lh+16}" font-size="11" fill="#706e6b">${esc(fmtInt(v))}</text></g>`; }).join('')}
  </svg>`;
}
function rosquinhaSvg(pares){
  const total = pares.reduce((s,p)=>s+p[1],0) || 1;
  const R=52, r=32, cx=70, cy=70; let ang=-Math.PI/2;
  const arco = (a0,a1,cor)=>{ const x0=cx+R*Math.cos(a0), y0=cy+R*Math.sin(a0), x1=cx+R*Math.cos(a1), y1=cy+R*Math.sin(a1);
    const xi1=cx+r*Math.cos(a1), yi1=cy+r*Math.sin(a1), xi0=cx+r*Math.cos(a0), yi0=cy+r*Math.sin(a0);
    const grande = (a1-a0) > Math.PI ? 1 : 0;
    return `<path d="M${x0},${y0} A${R},${R} 0 ${grande} 1 ${x1},${y1} L${xi1},${yi1} A${r},${r} 0 ${grande} 0 ${xi0},${yi0} Z" fill="${cor}"/>`; };
  const partes = pares.map(([n,v],i)=>{ const a0=ang, a1=ang+(v/total)*Math.PI*2; ang=a1; return arco(a0,a1,CORES[i%CORES.length]); }).join('');
  return `<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <svg viewBox="0 0 140 140" style="width:140px;height:140px">${partes}<text x="70" y="75" text-anchor="middle" font-size="18" font-weight="700" fill="#181818">${total}</text></svg>
    <div class="leg">${pares.map(([n,v],i)=>`<span><i style="background:${CORES[i%CORES.length]}"></i>${esc(n)} · ${v}</span>`).join('')}</div></div>`;
}

function topbar(title, canBack){ return `<div class="top"><button class="bk" onclick="back()" style="${canBack?'':'visibility:hidden'}">‹ Back</button><span class="ttl">${esc(title)}</span><button class="ic" onclick="go('search')">🔍</button></div>`; }

function pathHtml(steps, cur, sel, label, fn){
  const ci=steps.indexOf(cur), diff = sel && sel!==cur;
  return `<div class="pathw"><div class="path">${steps.map((s,i)=>`<div class="ps ${s===cur?'cur':''} ${i<ci?'done':''} ${s===sel&&diff?'sel':''}" onclick="${fn}Sel('${s}')">${i<ci?'✓':esc(s)}</div>`).join('')}</div>
    <div class="stage">${label}: ${esc(cur)}<button class="btn sm brand" onclick="${fn}Mark()">✓ ${diff?'Mark as Current '+label:'Mark '+label+' as Complete'}</button></div></div>`;
}
function simBotoes(){
  const on=(id,ok,titulo)=>{ const el=$('#'+id); if(!el) return; el.disabled=!ok; el.title=titulo; };
  on('s-prop', !!(S.quote && lines.some(l=>l.parent)), 'Gera a proposta no Lightning (no app o PDF não é criado)');
  on('s-assin', !!(S.contract && S.contract.esig==='Sent'), 'Retorno do DocuSign com o contrato assinado');
  on('s-ativar', !!(S.order && S.order.status!=='Activated'), 'Ativa o pedido');
  on('s-submit', !!(S.order && S.order.status==='Activated' && !S.order.submitted), 'Submete o pedido e dispara a decomposição');
}

/* ---------- Quote ---------- */
function telaQuote(){
  const q=S.quote, roots=lines.filter(l=>l.parent);
  return topbar('Quote', true) + actions([{i:'💬',c:'b',n:'Post',on:"S.sheet='post';render()"},{i:'🗂',c:'g',n:'Browse Catalogs',on:'browse()'},{i:'👤',c:'p',n:'New Contact',on:"go('newcontact')"},{i:'⋯',c:'m',n:'More',on:"S.sheet='more-quote';render()"}]) + `
  <div class="rh"><div class="oi g">🏷</div><div><small>Quote</small><b>${esc(q.name)}</b></div></div>
  <div class="rtabs"><a class="${S.tab==='Details'?'on':''}" onclick="S.tab='Details';render()">Details</a><a class="${S.tab==='Lines'?'on':''}" onclick="S.tab='Lines';render()">Lines</a><a class="${S.tab==='Related'?'on':''}" onclick="S.tab='Related';render()">Related</a><a class="${S.tab==='Chatter'?'on':''}" onclick="S.tab='Chatter';render()">Chatter</a></div>
  ${S.tab==='Details' ? pathHtml(QSTEPS, S.qStatus, S.qSel, 'Status', 'quote') + fields([['Quote Number',q.number],['Expiration Date',esc(q.exp)],['Syncing','<span class="chk"></span>'],['Opportunity Name',`<a onclick="go('opp')">${esc(oppName())}</a>`],['Account Name',`<a onclick="go('accounts')">${esc(CTX.conta.nome)}</a>`],['Grand Total',fmtMoney()],['Status',esc(S.qStatus)]])
  : S.tab==='Lines' ? `${fonte('ver','<b>Transaction Line Editor</b> — componente documentado para Lightning Experience (Trailhead "Discover and Configure Products").')}
    <div class="tle-h"><div class="oi">▤</div><b>Quote Line Items (${roots.length})</b><div class="tog ${S.instant?'on':''}"><span>Instant Pricing</span><div><div class="sw" onclick="S.instant=!S.instant;render()"></div><small>${S.instant?'Active':'Inactive'}</small></div></div></div>
    <div class="tle-tools"><button class="btn sm" onclick="S.sheet='addassets';render()">Add Assets</button><button class="btn sm" onclick="addGroup()">Add Group</button><button class="btn sm" style="flex:1" onclick="browse(true)">🔍 Add Product</button></div>
    ${S.groups.map(g=>`<div class="line grp">${esc(g)} <span class="badge">group</span></div>`).join('')}
    ${roots.length ? roots.map((l,i)=>{ const kids=lines.filter(x=>x.parentUid===l.uid);
      return `<div class="line"><div class="n"><span>${i+1}</span><b onclick="S.sheet='line:${l.uid}';render()">${esc(l.name)}</b>${l.viabOk?'<span class="badge ok">viável</span>':(l.id==='VPNNODE'||l.id==='LINKDED'||l.id==='BLEMP')?'<span class="badge warn">viabilidade pendente</span>':''}<button class="act" onclick="S.sheet='menu:${l.uid}';render()">▾</button></div>
        <div class="kv"><span>Quantity <b>${l.qty}.00</b></span><span>Selling Model <b>${SM[l.sell]||l.sell}</b></span><span>List Price <b>${fmtMoney()}</b></span><span>Net Amount <b>${fmtMoney()}</b></span><span>Discount <b>0.00%</b></span><span>Atendimento <b>${esc(l.classif||'—')}</b></span></div>
        ${kids.map(k=>`<div class="child">${esc(k.name)} · Qty 1.00 · ${SM[k.sell]||k.sell} · Included</div>`).join('')}</div>`; }).join('')
      : '<div class="line" style="color:var(--mut)">No quote line items. Use Browse Catalogs to add products.</div>'}
    ${roots.length?`<div class="line grp">Quote Summary <span class="badge">Product Subtotal ${fmtMoney()} · Discount 0.00% · Total with Tax ${fmtMoney()}</span></div>`:''}`
  : S.tab==='Related' ? relatedQuote() : feedHtml()}`;
}

function relatedQuote(){

.foot{position:static;max-width:1280px;margin:14px auto 0;background:0;border:0;padding:0 16px;justify-content:flex-end}
.foot .btn{flex:none;min-width:140px}
/* configurador em duas colunas */

.fld{padding:10px 0 0}
#view .cfgfields{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.sum{margin:0;position:sticky;top:104px}
.grp2{margin:18px 0 0}
.ccard{background:#fff}
.ph,.cfg-info,.mrow,.qty-r{background:#fff}
.ph,.cfg-top{border:1px solid var(--bd);border-bottom:0}
.cfg-top{border-radius:6px 6px 0 0;margin-top:4px}
.mtabs,.mrow,.cfg-info,.ph,.qty-r,.atabs{border-left:1px solid var(--bd);border-right:1px solid var(--bd)}
.atabs{padding:0 16px}

.form-h b{font-size:17px}
.ff{max-width:760px;margin:0 auto;border-left:1px solid var(--bd);border-right:1px solid var(--bd);padding:12px 18px}
.ff:last-of-type{border-bottom:1px solid var(--bd);border-radius:0 0 6px 6px}
.modal{max-width:560px;border-radius:8px;margin:auto}
.modal-bg{align-items:center;padding:24px}
.bsheet{max-width:420px;left:auto;right:24px;bottom:auto;top:96px;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.bsheet .grip{display:none}
.bsheet-bg{background:rgba(0,0,0,.15)}
/* Agentforce ancorado à direita */
.agent{display:none!important}
#lx .icons .agbtn{border:0;background:0;padding:0;width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
#lx .icons .agbtn:hover{background:#f4f6f9}
#lx .icons .agbtn img{width:24px;height:24px;object-fit:contain;display:block}
#agp{left:auto;right:0;top:var(--poch,0px);bottom:0;width:400px;max-width:400px;margin:0;border-left:1px solid var(--bd);box-shadow:-2px 0 10px rgba(0,0,0,.08);z-index:35}

/* utility bar do Lightning */
#ub{position:fixed;left:0;right:0;bottom:0;height:36px;background:#fff;border-top:1px solid var(--bd);display:flex;align-items:center;gap:0;z-index:32;padding-left:8px}
#ub button{border:0;background:0;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--tx);padding:0 14px;height:36px;border-right:1px solid var(--bd)}
#ub button:hover{background:#f4f6f9}
#ub .sp{margin-left:auto;color:var(--mut);font-size:11.5px;padding-right:14px}
/* roteiro e atendimento no desktop */
#guia{left:auto;right:16px;bottom:52px;max-width:420px;padding:0}
body.agp-open #guia{right:416px}
#atd{right:16px;bottom:calc(52px + 74px)}
body.agp-open #atd{right:416px}
#guia-abrir{right:16px;bottom:52px}
body.agp-open #guia-abrir{right:416px}
#poc{position:sticky;top:0;z-index:40}
.fnt,.nv-tag{margin:10px 0 0}
.toast{top:auto;bottom:56px;left:auto;right:16px;transform:none}

</style>`;
function docMoldura(titulo, corpo, nota){
  return `<div class="modal-bg" style="align-items:stretch"><div class="modal" style="max-height:100vh;border-radius:0;display:flex;flex-direction:column">
    <div class="form-h"><a onclick="S.docView=null;S.pdfView=false;render();agRetoma()">Fechar</a><b>${esc(titulo)}</b><a></a></div>
    ${nota?fonte('proto',esc(nota)):''}
    <div style="overflow:auto;background:#5f6b76;padding:12px;flex:1">
      <div class="doc" style="max-width:780px;margin:0 auto;box-shadow:0 6px 22px rgba(0,0,0,.45)">${DOC_CSS}${corpo}</div>
    </div></div></div>`;
}
function docCab(tit, sub, linhas){
  return `<div class="cab"><div><div class="marca">ALGAR</div><div class="sub">${esc(sub)}</div></div>
    <div class="num"><b>${esc(tit)}</b>${linhas.map(l=>`<div>${esc(l)}</div>`).join('')}</div></div>`;
}
function docPartes(rows){ return `<div class="wrap"><table class="partes"><tbody>${rows.map(([k,v])=>`<tr><th>${esc(k)}</th><td>${v}</td></tr>`).join('')}</tbody></table></div>`; }
function docAtributos(l){
  const skip=['Localidade','Endereço de instalação','Entidade faturadora','Período Fidelização','Tipo de Reajuste','Índice de Reajuste','Data do Próximo Reajuste','Percentual da Multa','Quantidade de Dias Aviso Previo','Data de Assinatura do Contrato','Data Base','Reajustar Antes de 12 Meses','Data de Início do Contrato','Data de Término do Contrato'];
  const ats=Object.entries(l.attrs||{}).filter(([k])=>!skip.includes(k));
  if(!ats.length) return '';
  return `<div class="grade">${ats.map(([k,v])=>`<div><b>${esc(k)}</b>${esc(v)}</div>`).join('')}</div>`;
}
function docComponentes(kids){
  if(!kids.length) return '';
  return `<table><thead><tr><th style="width:46%">Componente</th><th>Modalidade / plano</th><th class="n" style="width:16%">Qtd</th><th style="width:22%">Valor</th></tr></thead><tbody>
    ${kids.map(k=>`<tr><td>${esc(k.name)}</td><td>${esc((k.attrs&&(k.attrs['Modalidade Equipamento']||k.attrs['Plano MIR']||k.attrs['Velocidade Temporária']))||'—')}</td><td class="n">${k.qty||1}</td><td>${(k.attrs&&k.attrs['Modalidade Equipamento']==='Comodato')?'Incluído':'Pendente'}</td></tr>`).join('')}</tbody></table>`;
}
function docItens(roots, getKids, comAtend){
  return `<table class="itens"><thead><tr><th style="width:26px">#</th><th>Produto</th><th style="width:64px">Qtd</th><th style="width:96px">Modelo</th>${comAtend?'<th style="width:104px">Atendimento</th>':''}<th class="n" style="width:92px">Valor mensal</th></tr></thead><tbody>
    ${roots.map((l,i)=>`<tr><td>${i+1}</td><td class="item-tit">${esc(l.name)}</td><td>${l.qty}</td><td>${esc(SM[l.sell]||l.sell)}</td>${comAtend?`<td>${esc(l.classif||'—')}</td>`:''}<td class="n">Pendente</td></tr>`).join('')}
  </tbody></table>
  ${roots.map((l,i)=>`<h3>Item ${i+1} · ${esc(l.name)}</h3><div class="wrap">
     <table class="partes"><tbody>
       <tr><th>Local de instalação</th><td>${esc((l.attrs&&l.attrs['Endereço de instalação'])||'—')}</td></tr>
       <tr><th>Localidade / território</th><td>${esc((l.attrs&&l.attrs['Localidade'])||'—')}</td></tr>
       <tr><th>Entidade faturadora</th><td>${esc((l.attrs&&l.attrs['Entidade faturadora'])||'—')}</td></tr>
     </tbody></table>
     ${docAtributos(l)}
     ${docComponentes(getKids(l))}</div>`).join('')}`;
}
function docCondicoes(l0){
  const c=['Período Fidelização','Tipo de Reajuste','Índice de Reajuste','Data do Próximo Reajuste','Data de Assinatura do Contrato','Data Base','Percentual da Multa','Quantidade de Dias Aviso Previo','Data de Início do Contrato','Data de Término do Contrato']
    .filter(k=>l0.attrs&&l0.attrs[k]).map(k=>[k,l0.attrs[k]]);
  if(!c.length) return '<p class="obs">Sem condições contratuais informadas.</p>';
  return `<div class="grade">${c.map(([k,v])=>`<div><b>${esc(k)}</b>${esc(v)}</div>`).join('')}</div>`;
}
function docRodape(txt){ return `<div class="rod">${esc(txt)}</div>`; }

function docHtml(tipo){
  const roots=lines.filter(l=>l.parent), l0=roots[0]||{attrs:{}};
  const kids=l=>lines.filter(x=>x.parentUid===l.uid);
  if(tipo==='quote'){
    const corpo = docCab('Cotação '+S.quote.number, 'Resumo da cotação · Conectividade corporativa',
        ['Status: '+S.qStatus, 'Validade: '+S.quote.exp, 'Emissão: '+new Date().toLocaleDateString('pt-BR')])
      + docPartes([['Cliente', esc(CTX.conta.nome)+' · '+esc(CTX.conta.segmento)],['Oportunidade', esc(oppName())],['Responsável', esc(CTX.usuario.nome)],['Tabela de preços', esc(S.pb||'Tabela de Preços B2B (a definir)')]])
      + `<h3>Itens da cotação (${roots.length})</h3><div class="wrap">${roots.length?docItens(roots,kids,true):'<p class="obs">Cotação sem itens.</p>'}
         <div class="tot"><span>Total mensal</span><span>Pendente</span></div>
         <p class="obs">Preços pendentes: tabela e procedimento de precificação não definidos na Revisão 1.</p></div>`
      + `<h3>Condições contratuais</h3><div class="wrap">${docCondicoes(l0)}</div>`
      + (S.pdfs.length||S.contract||S.order ? `<h3>Documentos relacionados</h3><div class="wrap"><table><tbody>
          ${S.pdfs.length?`<tr><th style="width:34%">Proposta enviada</th><td>${esc(S.pdfs[0].name)} · ${esc(S.pdfs[0].quando)}</td></tr>`:''}
          ${S.contract?`<tr><th>Contrato</th><td>${esc(S.contract.number)} · ${esc(S.contract.status)} · assinatura ${esc(S.contract.esig)}</td></tr>`:''}
          ${S.order?`<tr><th>Pedido</th><td>${esc(S.order.number)} · ${esc(S.order.status)}${S.order.submitStatus?' · '+esc(S.order.submitStatus):''}</td></tr>`:''}
        </tbody></table></div>`:'')
      + docRodape('Documento gerado pelo protótipo a partir do registro da cotação · ALGAR TELECOM');
    return docMoldura('Cotação '+S.quote.number, corpo, 'Visualização do protótipo: documento montado a partir do registro. No app, o registro é consultado nas abas Details, Lines e Related.');
  }
  if(tipo==='contract'){
    const c=S.contract;
    const corpo = docCab('Contrato '+c.number, 'Contrato de prestação de serviços · Conectividade corporativa',
        ['Status: '+c.status, 'Assinatura: '+c.esig, 'Emissão: '+new Date().toLocaleDateString('pt-BR')])
      + docPartes([['Contratante', esc(CTX.conta.nome)],['Contratada', esc(entidadeFaturadora().valor)],['Origem', 'Cotação '+esc(S.quote.number)],['Documento', c.docs[0]?esc(c.docs[0].name)+' · '+esc(c.docs[0].v):'—']])
      + `<h3>Objeto</h3><div class="wrap"><p class="obs">Prestação de serviço de conectividade corporativa nos termos da cotação ${esc(S.quote.number)}, compreendendo ${roots.length} item(ns).</p>
         ${roots.length?docItens(roots,kids,false):''}</div>`
      + `<h3>Cláusulas contratuais</h3><div class="wrap">${docCondicoes(l0)}
         <p class="obs">Valores pendentes de precificação. Faturamento por ${esc((l0.attrs&&l0.attrs['Entidade faturadora'])||'—')}.</p></div>`
      + ((S.acrs||[]).length?`<h3>Assets cobertos (Asset Contract Relationship)</h3><div class="wrap"><table><thead><tr><th>Asset</th><th style="width:110px">ACR</th><th style="width:150px">Vigência</th></tr></thead><tbody>
          ${S.acrs.map(x=>`<tr><td>${esc(x.assetName)}</td><td>${esc(x.name)}</td><td>${esc(x.start)}${x.end?' a '+esc(x.end):''}</td></tr>`).join('')}</tbody></table></div>`:'')
      + `<h3>Assinaturas</h3><div class="wrap"><div class="ass">${(c.recipients.length?c.recipients:[{email:'—',role:'Signer',status:'Pendente'}]).map(r=>`<div>${esc(r.email)}<small>${esc(r.role)} · ${esc(r.status)}</small>${r.status==='Completed'?'<div class="ok">✓ assinado eletronicamente via DocuSign</div>':''}</div>`).join('')}</div>
         ${c.events.length?`<p class="obs" style="margin-top:10px">${c.events.map(esc).join('<br>')}</p>`:''}</div>`
      + docRodape('Documento gerado pelo protótipo · Salesforce Contracts + DocuSign · ALGAR TELECOM');
    return docMoldura('Contrato '+c.number, corpo, 'Visualização do protótipo: documento montado a partir do registro. No app, o contrato é consultado nas abas Details e Related.');
  }
  /* pedido */
  const o=S.order, oroots=o.lines.filter(l=>l.parent), okids=l=>o.lines.filter(x=>x.parentUid===l.uid);
  const corpo = docCab('Pedido '+o.number, 'Resumo do pedido · Conectividade corporativa',
      ['Status: '+o.status+(o.submitStatus?' · '+o.submitStatus:''), 'Início: '+o.start, o.activatedAt?'Ativado: '+o.activatedAt:''].filter(Boolean))
    + docPartes([['Cliente', esc(CTX.conta.nome)],['Origem', 'Cotação '+esc(S.quote.number)+(S.contract?' · Contrato '+esc(S.contract.number):'')],['Faturamento', esc((oroots[0]&&oroots[0].attrs&&oroots[0].attrs['Entidade faturadora'])||'—')]])
    + `<h3>Order Products (${oroots.length})</h3><div class="wrap">
       <table class="itens"><thead><tr><th style="width:26px">#</th><th>Produto</th><th style="width:56px">Qtd</th><th style="width:96px">Billing</th><th class="n" style="width:92px">Net total</th></tr></thead><tbody>
       ${oroots.map((l,i)=>`<tr><td>${i+1}</td><td class="item-tit">${esc(l.name)}</td><td>${l.qty}</td><td>Monthly</td><td class="n">Pendente</td></tr>`).join('')}</tbody></table>
       ${oroots.map((l,i)=>`<div style="margin-bottom:10px"><div class="obs"><b>Item ${i+1} · ${esc(l.name)}</b> — ${esc((l.attrs&&l.attrs['Endereço de instalação'])||'')}</div>${docComponentes(okids(l))}</div>`).join('')}
       <div class="tot"><span>Order Amount</span><span>Pendente</span></div></div>`
    + (o.fls?`<h3>Decomposição em produtos técnicos (${o.fls.length})</h3><div class="wrap">
       <table><thead><tr><th>Produto técnico</th><th style="width:120px">Escopo</th><th style="width:150px">Sistema</th><th style="width:120px">Origem</th></tr></thead><tbody>
       ${o.fls.map(f=>`<tr><td>${esc(f.name)}</td><td>${esc(f.scope)}</td><td>${esc(f.sistema)}</td><td>${esc(f.source)}</td></tr>`).join('')}</tbody></table>
       <table><tbody><tr><th style="width:34%">Plano de orquestração</th><td>${esc(o.plan.status)} — ${o.plan.steps.filter(s=>s.status==='Completed').length}/${o.plan.steps.length} etapas concluídas</td></tr>
       <tr><th>Tarefas manuais</th><td>${o.plan.steps.filter(s=>s.type==='Manual Task').length} no plano · ${pendentesManuais().length} pendente(s)</td></tr></tbody></table></div>`
      :'<div class="wrap"><p class="obs">Pedido ainda não submetido: sem decomposição em produtos técnicos.</p></div>')
    + (S.assets.length?`<h3>Assets criados</h3><div class="wrap"><table><thead><tr><th>Asset</th><th style="width:34%">Componentes</th><th style="width:140px">Contrato (ACR)</th></tr></thead><tbody>
       ${S.assets.map(a=>{ const acr=(S.acrs||[]).find(x=>x.assetId===a.id); return `<tr><td>${esc(a.name)}</td><td>${esc(a.children.join(', '))}</td><td>${acr?esc(acr.contract)+' · '+esc(acr.name):'—'}</td></tr>`; }).join('')}</tbody></table>
       ${(S.fassets||[]).length?`<table><thead><tr><th>Fulfillment Asset</th><th style="width:100px">Qtd</th><th style="width:120px">Status</th></tr></thead><tbody>${S.fassets.map(f=>`<tr><td>${esc(f.name)}</td><td>${f.qty}</td><td>${esc(f.status)}</td></tr>`).join('')}</tbody></table>`:''}</div>`:'')
    + docRodape('Documento gerado pelo protótipo a partir do registro do pedido · ALGAR TELECOM');
  return docMoldura('Pedido '+o.number, corpo, 'Visualização do protótipo: documento montado a partir do registro. No app, o pedido é consultado nas abas Details, Lines e Decomposition.');
}
function pdfViewHtml(){
  const roots=lines.filter(l=>l.parent), l0=roots[0]||{attrs:{}};
  const kids=l=>lines.filter(x=>x.parentUid===l.uid);
  const corpo = docCab('Proposta comercial', 'Conectividade corporativa · Cotação '+S.quote.number,
      ['Cliente: '+CTX.conta.nome, 'Validade: '+S.quote.exp, 'Emissão: '+(S.pdfs[0]?S.pdfs[0].quando:new Date().toLocaleDateString('pt-BR'))])
    + docPartes([['Cliente', esc(CTX.conta.nome)],['Segmento', esc(CTX.conta.segmento)],['Preparado por', esc(CTX.usuario.nome)],['Documento', S.pdfs[0]?esc(S.pdfs[0].name):'—']])
    + `<h3>Itens da proposta (${roots.length})</h3><div class="wrap">${roots.length?docItens(roots,kids,true):'<p class="obs">Sem itens.</p>'}
       <div class="tot"><span>Total mensal</span><span>Pendente</span></div>
       <p class="obs">Preços pendentes: a Revisão 1 não define tabela nem procedimento de precificação.</p></div>`
    + `<h3>Condições contratuais</h3><div class="wrap">${docCondicoes(l0)}
       <p class="obs">Entidade faturadora: ${esc((l0.attrs&&l0.attrs['Entidade faturadora'])||'—')}.</p></div>`
    + `<h3>Aceite</h3><div class="wrap"><div class="ass"><div>${esc(CTX.conta.nome)}<small>Representante legal · assinatura</small></div><div>${esc(entidadeFaturadora().valor)}<small>${esc(CTX.usuario.nome)} · assinatura</small></div></div></div>`

}

function modalBuying(pid){ const p=findProd(pid); return `<div class="modal-bg"><div class="modal"><h3>${esc(p.name)} Buying options</h3><div class="mb"><label class="radio"><input type="radio" name="bo" checked>Preço pendente for ${SM[p.sell]||p.sell}</label><p style="font-size:12px;color:var(--mut);margin:6px 0 0">ProductSellingModel ${SM[p.sell]||p.sell}. Tabela e procedimento de preços não definidos na Revisão 1.</p></div>

function novoCfg(p){ const cfg={prod:p,defs:resolveAttrs(p),a:{},c:{},toque:{},autoSig:null}; cfg.defs.forEach(a=>{ if(a.def) cfg.a[a.key]=a.def; if(a.ui==='checkbox') cfg.a[a.key]=false; }); (p.groups||[]).forEach(g=>g.produtos.forEach(pid=>cfg.c[compKey(pid)]=[])); return cfg; }
function addLine(p,cfg,R){
  lineSeq++; const attrs={};
  if(cfg) cfg.defs.filter(a=>!a.hidden&&!R.hidden[a.key]&&!vazio(cfg.a[a.key])).forEach(a=>attrs[a.name]=cfg.a[a.key]===true?'Sim':cfg.a[a.key]);
  attrs['Localidade']=CTX.localidade.nome+' · '+CTX.localidade.territorio; attrs['Endereço de instalação']=endFull().nome; attrs['Entidade faturadora']=entidadeFaturadora().valor;
  const line={uid:'L'+lineSeq,id:p.id,name:p.name,sell:p.sell,qty:(S.qtd[p.id]||1),parent:true,attrs,classif:R?R.cls.v:'',loc:CTX.localidade.id,end:endFull().id,viabOk:!!S.viab[endFull().id]};
  lines.push(line);
  if(cfg) (p.groups||[]).flatMap(g=>g.produtos).forEach(pid=>(cfg.c[compKey(pid)]||[]).forEach(x=>{ const cp=findProd(pid),at={}; resolveAttrs(cp).forEach(a=>{ if(!vazio(x[a.key])) at[a.name]=x[a.key]; }); if(x.Quantidade) at['Quantidade']=x.Quantidade; lineSeq++; lines.push({uid:'L'+lineSeq,id:cp.id,name:(x.TipoEquipamento||cp.name),sell:cp.sell,qty:x.Quantidade||1,parent:false,parentUid:line.uid,attrs:at}); }));
  return line;
}
const ACESSO = ['VPNNODE','LINKDED','BLEMP'];
function quickAdd(pid){ const p=findProd(pid); if(ACESSO.includes(pid)){ S.pend={pid, mode:'add'}; go('local'); return; } if(isConfigurable(p)){ const cfg=novoCfg(p); const R=avaliar(cfg); const l=addLine(p,cfg,R); l.cfgState={a:cfg.a,c:cfg.c,toque:cfg.toque,autoSig:cfg.autoSig}; } else addLine(p,null,null); toast(p.name+' added to quote.'); render(); }
function addSel(){ Object.keys(S.checked).filter(k=>S.checked[k]).forEach(pid=>quickAdd(pid)); S.checked={}; render(); }

function avaliarUI(cfg){ const R=avaliar(cfg); if(!S.viab[endFull().id]) R.msgs=R.msgs.filter(m=>!(m.regra==='R11'&&m.texto.indexOf('no mínimo 1 equipamento')>=0)); return R; }
function openConfig(id,uid,pularEndereco){
  const p=findProd(id); const qp=qualificadoProduto(p); if(!qp.ok){ toast(qp.hits[qp.hits.length-1].motivo,'warn'); return; }
  if(ACESSO.includes(id) && !uid && !pularEndereco){ S.pend={pid:id, mode:'config'}; go('local'); return; }   /* UC passo 1: o endereço é por node */
  cfgProduct=novoCfg(p); cfgProduct.uid=uid||null;
  if(uid){ const l=lines.find(x=>x.uid===uid); if(l&&l.cfgState){ cfgProduct.a=JSON.parse(JSON.stringify(l.cfgState.a)); cfgProduct.c=JSON.parse(JSON.stringify(l.cfgState.c)); cfgProduct.toque=Object.assign({},l.cfgState.toque); cfgProduct.autoSig=l.cfgState.autoSig; } }
  S.msgTab=null; S.atab=null; S.grpOpen={}; S.compOpen={}; S.sumOpen=false; go('config');
}

  ${msgs.filter(m=>m.sev===S.msgTab).map(m=>`<div class="mrow ${m.sev}"><i>${m.sev==='Error'?'⊘':m.sev==='Warning'?'▲':'ⓘ'}</i><span>${esc(m.texto)}</span></div>`).join('')}`:''}

      return `<div class="card"><div class="h"><a>${esc(x.TipoEquipamento||cp.name)}</a>${chip?`<span class="chip">${esc(chip)}</span>`:''}</div><div style="display:flex;justify-content:space-between"><span>Quantity 1</span><span>Net Amount ${pid==='EQUIP'&&x.ModalidadeEquipamento==='Comodato'?'Included':fmtMoney()}</span></div></div>`; })).join('')||'<div class="card" style="color:var(--mut)">Nenhum item selecionado</div>'}</div>`).join('')}

function field(a,R,obj,key){
  const attr=key.includes('#')?key.split('.').pop():a.key; const val=obj[attr], dis=R.disabled[key]||a.ro, req=R.required[key], er=S.validacao&&R.ferr[key]; const hv=R.hideVals[key]||{};
  let ctl;
  if(a.ui==='picklist') ctl=`<select ${dis?'disabled':''} onchange="setAttr('${key}',this.value)"><option value="">--None--</option>${a.values.filter(v=>!hv[v]).map(v=>`<option ${val===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`;
  else if(a.ui==='checkbox') ctl=`<div class="cbx"><input type="checkbox" ${val?'checked':''} ${dis?'disabled':''} onchange="setAttr('${key}',this.checked)"><span>${esc(a.values[0]||'Sim')}</span></div>`;
  else if(a.ui==='network'){ const nets=CTX_DATA.networks[CTX.conta.cnpjRaiz]||[]; ctl=`<select onchange="setAttr('${key}',this.value)"><option value="">--None--</option>${nets.map(n=>`<option value="${n.id}" ${val===n.id?'selected':''}>${esc(n.id+' · '+n.nome)}</option>`).join('')}<option value="NOVA" ${val==='NOVA'?'selected':''}>+ Criar nova VPN Network</option></select>`; }
  else { const type=(a.ui==='number'||a.ui==='currency')?'number':(a.ui==='date'&&!dis)?'date':'text'; ctl=`<input type="${type}" value="${val==null?'':esc(val)}" ${dis?'disabled':''} onchange="setAttr('${key}',this.value)">`; }
  const obrig = req || (a.obg && !a.ro);
  return `<div class="fld ${er?'err':''}"><label>${obrig?'<span class="rq">*</span>':''}${esc(a.name)}${a.unit?' ('+esc(a.unit)+')':''}</label>${ctl}${er?`<div class="ferr">${esc(R.ferr[key])}</div>`:''}${(a.duvida||a.pend)?`<div class="help">${esc(a.duvida||a.pend)}</div>`:''}</div>`;
}
function compCards(pid,R){
  const cp=findProd(pid), key=compKey(pid), arr=cfgProduct.c[key]||[], ex=R.excl[key];
  const card=(label,on,x,i,openKey,attrsHtml,extra,bloq,selo)=>`<div class="ccard ${on?'sel':''} ${(ex||bloq)?'blq':''}" ${(ex||bloq)?`title="${esc((ex&&ex.texto)||bloq)}"`:''}><div class="r"><input type="checkbox" ${on?'checked':''} ${(ex||bloq)?'disabled':''} onchange="${pid==='EQUIP'?`togEquip('${label}',this.checked)`:`togComp('${pid}',this.checked)`}"><span class="nm">${esc(label)}${selo||''} <span style="color:var(--brand);font-size:11px">✎</span></span><span class="pr">${on&&x&&x.ModalidadeEquipamento==='Comodato'?'Included':fmtMoney()}</span><button class="gear" ${on?'':'disabled'} onclick="S.compOpen['${openKey}']=!S.compOpen['${openKey}'];render()">⚙</button><button class="ch" onclick="S.compOpen['${openKey}']=!S.compOpen['${openKey}'];render()">${S.compOpen[openKey]?'⌃':'⌄'}</button></div>
    <div class="r2"><span class="sm">${SM[cp.sell]||cp.sell} ▾</span>${on?`<label class="qlbl">Qtd <input class="qin" type="number" min="1" ${(x&&x.TipoEquipamento==='Roteador')?'max="1"':''} value="${(x&&x.Quantidade!==undefined)?x.Quantidade:1}" onchange="setQtdComp('${pid}','${(x&&x.TipoEquipamento)||''}',this.value)"></label>`:`<span class="q"></span>`}</div>${extra||''}
    ${(ex||bloq)?`<div class="blqmsg">🚫 ${esc((ex&&ex.texto)||bloq)}</div>`:''}
    ${S.compOpen[openKey]?`<div class="ds">${esc(cp.desc)}${x&&x.auto?' · Adicionado por regra.':''}</div>${on?`<div class="cbody">${attrsHtml}</div>`:''}`:''}</div>`;
  if(pid==='EQUIP') return EQUIP_TIPOS.map(tipo=>{ const i=arr.findIndex(x=>x.TipoEquipamento===tipo), on=i>=0, x=on?arr[i]:null;
    const exig=F.equipamentosPorTecnologia(cfgProduct.a.Tecnologia, CTX.endereco.anel).map(q=>q.TipoEquipamento);
    const bloq = (!on && tipo==='Roteador' && arr.some(y=>y.TipoEquipamento==='Roteador')) ? 'Roteador tem cardinalidade máxima de 1.'
               : (on && exig.includes(tipo)) ? null : null;
    const selo = exig.includes(tipo) ? ' <span class="exig">exigido pela tecnologia</span>' : '';
    return card(tipo,on,x,i,pid+tipo,on?resolveAttrs(cp).filter(a=>a.key!=='TipoEquipamento').map(a=>field(a,R,x,key+'#'+i+'.'+a.key)).join(''):'','',bloq,selo); }).join('');
  const on=arr.length>0, x=on?arr[0]:null;
  return card(cp.name,on,x,0,pid,on?resolveAttrs(cp).map(a=>field(a,R,x,key+'#0.'+a.key)).join(''):'', ex?`<div class="ds" style="color:var(--err)">${esc(ex.texto)}</div>`:'');
}
function setQtdComp(pid,tipo,val){
  const key=compKey(pid), arr=cfgProduct.c[key]||[];
  const it = tipo ? arr.find(x=>x.TipoEquipamento===tipo) : arr[0];
  if(!it) return;
  const n=Number(val); it.Quantidade = isNaN(n)?1:n;
  if(tipo==='Roteador' && it.Quantidade>1) toast('Roteador tem cardinalidade máxima de 1.','warn');
  const y=window.scrollY; render(); window.scrollTo(0,y);
}
function togEquip(tipo,on){
  if(on && tipo==='Roteador' && (cfgProduct.c.equip||[]).some(x=>x.TipoEquipamento==='Roteador')){ toast('Roteador tem cardinalidade máxima de 1.','err'); return; } const arr=cfgProduct.c.equip||(cfgProduct.c.equip=[]); const i=arr.findIndex(x=>x.TipoEquipamento===tipo); if(on&&i<0){ const o={}; resolveAttrs(findProd('EQUIP')).forEach(a=>o[a.key]=a.def||''); o.TipoEquipamento=tipo; o.Quantidade=1; arr.push(o); } if(!on&&i>=0) arr.splice(i,1); cfgProduct.autoSig='manual'; render(); }
function togComp(pid,on){ const key=compKey(pid), cp=findProd(pid);
  const Rx=avaliarUI(cfgProduct); if(on && Rx.excl[key]){ toast(Rx.excl[key].texto,'err'); return; } if(on){ const o={}; resolveAttrs(cp).forEach(a=>o[a.key]=a.def||''); o.Quantidade=1; cfgProduct.c[key]=[o]; S.compOpen[pid]=true; } else cfgProduct.c[key]=[]; render(); }
function setAttr(key,val){ const [obj,attr]=resolveRef(cfgProduct,key); if(!obj) return; obj[attr]=val; if(!key.includes('#')) cfgProduct.toque[attr]=true; const y=window.scrollY; render(); window.scrollTo(0,y); }
function cancelCfg(){ cfgProduct=null; S.tab='Lines'; go(S.catalogo?'browse':'quote'); }
function saveExit(){ const doAgente = AG.cfg && cfgProduct===AG.cfg; if(doAgente){ AG.cfg=null; AG.equipOk=false; AG.svaOk=false; } const R=avaliarUI(cfgProduct); if(S.validacao&&R.msgs.some(m=>m.sev==='Error')){ toast('Resolve the errors before saving.','warn'); return; }
  const p=cfgProduct.prod; if(cfgProduct.uid) lines=lines.filter(l=>l.uid!==cfgProduct.uid&&l.parentUid!==cfgProduct.uid);
  const line=addLine(p,cfgProduct,R); line.cfgState={a:cfgProduct.a,c:cfgProduct.c,toque:cfgProduct.toque,autoSig:cfgProduct.autoSig};
  cfgProduct=null; S.tab='Lines'; go(S.catalogo?'browse':'quote'); toast(p.name+' was configured and added to the quote.');
  if(doAgente && AG.thread.length) setTimeout(agNext,0); }

/* ================= Dynamic Revenue Orchestrator ================= */
/* Verificado (Trailhead DRO): Activate → Submit Order → decomposição em produtos técnicos (record type Technical; escopo
   Bundle / Order Line Item / Account; Is Assetizable) → aba Decomposition Details → View Orchestration Plan → raias por
   produto técnico, etapas Manual Task / Callout / Auto Task / Milestone → Managed Assets + Fulfillment Assets.
   Inferido (projeto): quais produtos técnicos, etapas e sistemas do VPN Node. */
const TECH = {
  ACESSO: { code:'TECH-ACESSO', name:'Circuito de Acesso', scope:'Order Line Item', sistema:'OSS / Provisionamento Algar',

  CPE: { code:'TECH-CPE', name:'Equipamento de Acesso (CPE)', scope:'Order Line Item', sistema:'Estoque / Field Service',

const DECOMP_RULES = [
  { src:'VPN Node', tech:['ACESSO','NETWORK','FAT'], cond:'sempre' },
  { src:'Link de Internet Dedicado', tech:['ACESSO','FAT'], cond:'sempre' },
  { src:'Banda Larga Empresarial', tech:['ACESSO','FAT'], cond:'sempre' },
  { src:'Equipamento de Acesso', tech:['CPE'], cond:'um por equipamento' },
  { src:'Upgrade Temporário de Velocidade', tech:['UPG'], cond:'se SVA contratado' },
  { src:'Monitoramento Inteligente de Rede', tech:['MIR'], cond:'se SVA contratado' }
];
function decompor(order){
  const out=[]; let seq=0;
  const add=(k,src,det)=>{ const t=TECH[k]; const key=t.scope==='Account'?k:t.scope==='Bundle'?k+'|'+src.uid:k+'|'+src.uid; if(out.some(x=>x.key===key)) return; seq++; out.push({ id:'FL-'+seq, key, tech:k, name:t.name+(det?' · '+det:''), scope:t.scope, sistema:t.sistema, source:src.name, srcUid:src.uid }); };
  order.lines.filter(l=>l.parent).forEach(l=>{
    const rule=DECOMP_RULES.find(r=>r.src===l.name); if(rule) rule.tech.forEach(k=>add(k,l,k==='ACESSO'?(l.attrs&&l.attrs['Tecnologia']||''):''));
    order.lines.filter(x=>x.parentUid===l.uid).forEach(k=>{
      if(EQUIP_TIPOS.includes(k.name)) add('CPE',k,k.name);
      else { const r2=DECOMP_RULES.find(r=>r.src===k.name); if(r2) r2.tech.forEach(t=>add(t,k,k.attrs&&(k.attrs['Plano MIR']||k.attrs['Velocidade Temporária'])||'')); }
    });
  });
  return out;
}
function montarPlano(fls){
  const steps=[]; let n=0;
  fls.forEach(fl=>{ let prev=null; TECH[fl.tech].steps.forEach(([nm,tp])=>{ n++; const s={ id:'S'+n, lane:fl.id, laneName:fl.name, name:nm, type:tp, status:'Not Started', deps:prev?[prev]:[] }; steps.push(s); prev=s.id; }); });
  // dependências entre raias (inferidas): ativação lógica do circuito depende do CPE configurado; fatura depende do circuito ativo; associar node depende do circuito ativo
  const find=(tech,nm)=>steps.filter(s=>s.laneName.startsWith(TECH[tech].name)&&s.name===nm);
  find('ACESSO','Ativação lógica do circuito').forEach(s=>{ find('CPE','Configuração do equipamento').forEach(c=>s.deps.push(c.id)); });
  find('NETWORK','Associar o node à network').forEach(s=>{ find('ACESSO','Circuito ativo').forEach(c=>s.deps.push(c.id)); });
  find('FAT','Gerar fatura').forEach(s=>{ find('ACESSO','Circuito ativo').forEach(c=>s.deps.push(c.id)); });
  find('MIR','Criar host com o template do plano').forEach(s=>{ find('ACESSO','Circuito ativo').forEach(c=>s.deps.push(c.id)); });
  return { status:'In Progress', steps, log:[] };
}
function planoTick(){
  const o=S.order; if(!o||!o.plan||o.plan.status==='Completed') return;
  const P=o.plan; const done=id=>P.steps.find(s=>s.id===id).status==='Completed';
  let changed=false;
  P.steps.forEach(s=>{ if(s.status!=='Not Started'&&s.status!=='In Progress') return;
    if(!s.deps.every(done)) return;
    if(s.type==='Manual Task'){ if(s.status!=='In Progress'){ s.status='In Progress'; P.log.push(`${s.laneName}: tarefa manual "${s.name}" aguardando conclusão`); changed=true; } return; }
    if(s.status==='Not Started'){ s.status='In Progress'; changed=true; }
    else { s.status='Completed'; P.log.push(`${s.laneName}: ${s.name} — ${s.type} concluída`); changed=true; }
  });
  if(P.steps.every(s=>s.status==='Completed')){ P.status='Completed'; P.log.push('Plano concluído: assets comerciais e de fulfillment criados'); criarAssets(); }
  if(changed) render();
  const podeAndar = P.status!=='Completed' && P.steps.some(s=>{
    if(s.status==='In Progress') return s.type!=='Manual Task';
    if(s.status==='Not Started') return s.deps.every(done);
    return false;
  });
  clearTimeout(window._planTick);
  if(podeAndar) window._planTick=setTimeout(planoTick,900);
}
function completarManual(id){ const s=S.order.plan.steps.find(x=>x.id===id); if(!s||s.type!=='Manual Task'||s.status!=='In Progress') return; s.status='Completed'; S.order.plan.log.push(`${s.laneName}: ${s.name} — concluída manualmente`); toast('Task completed.'); render(); setTimeout(planoTick,300); }

function criarAssets(){
  const o=S.order; const hoje=new Date();

}

function convertLead(){
  const l = LEADS.find(x=>x.id===S.leadId) || LEADS[0];
  const f = S.form.conv || {};
  const conta = CTX_DATA.contas.find(c=>c.nome===f.conta);
  if(conta) CTX.conta = conta;
  S.conv = { lead:l.id, conta:f.conta, contato:f.contato, opp:f.criarOpp?f.opp:null, quando:new Date().toLocaleString('pt-BR'), status:f.status||'Convertido' };
  S.leadStatus = 'Convertido';
  S.contacts = [{name:f.contato, role:'Decision Maker', email:(l.Email||'contato@cliente.com.br')}];
  if(f.criarOpp){ S.oppNome = f.opp; S.oStage = 'Qualification'; S.tab='Details'; S.hist=['lead']; go('opp',true);
    toast('Lead convertido: conta, contato e oportunidade criados.');
    agSay(`Converti o lead. Conta ${f.conta}, contato ${f.contato} e a oportunidade "${f.opp}" em Qualification. O próximo passo é avançar o estágio e criar a cotação.`, agAtuais(), 'Conversão de lead (Sales Cloud)');
  } else { S.tab='Details'; go('accounts',true); toast('Lead convertido sem oportunidade.'); }
}

function agEquipConcluir(){
  const arr=AG.cfg.c.equip||(AG.cfg.c.equip=[]);

  const exigidos=F.equipamentosPorTecnologia(tec, anel).map(x=>x.TipoEquipamento);
  const falta=F.equipamentosFaltando(tec, anel, arr);
  const src='Regras do UC-VPN-001: dimensionamento por tecnologia, mínimo de 1 equipamento, cardinalidade do Roteador e modalidade por item';

  /* 6 · tudo certo */
  AG.equipOk=true;
  agSay(`Equipamentos validados: ${agEquipResumo()}.`, []);
  agNextCfg();

async function agConcluirPlano(){
  const o=S.order; if(!o||!o.plan){ agNext(); return; }
  agSay('Vou concluir as tarefas manuais e acompanhar até o plano fechar.',[]);
  let g=0;
  while(o.plan.status!=='Completed' && g++<80){
    planoTick();
    const m=pendentesManuais();
    if(m.length){ const s=m[0]; completarManual(s.id); agSay(`Concluí a tarefa manual "${s.name}" (${s.laneName}).`,[]); }
    await agEspera(420);
  }
  if(o.plan.status==='Completed') agSay(`Plano concluído: ${o.plan.steps.length} etapas. Assets criados — ${S.assets.length} comercial e ${(S.fassets||[]).length} de fulfillment.`, agAtuais(),'Managed Assets + Fulfillment Assets');

}
function agAndamento(){ const o=S.order; if(!o||!o.plan){ agNext(); return; } planoTick(); const P=o.plan; const done=P.steps.filter(s=>s.status==='Completed').length; const man=pendentesManuais();
  if(P.status==='Completed'){ agSay(`Plano concluído: ${P.steps.length}/${P.steps.length} etapas. Assets criados: ${S.assets.length} comercial (${S.assets.map(a=>a.name).join(', ')}) e ${(S.fassets||[]).length} de fulfillment (${(S.fassets||[]).map(f=>f.name).join('; ')}).`, [{l:'Ver os assets da conta',f:()=>{S.tab='Assets';agClose();S.hist=['order'];go('accounts',true);},pri:true},{l:'Resumo',f:()=>agSay(agResumo(),agAtuais())}]); return; }
  if(man.length){ const s=man[0]; agSay(`Andamento: ${done}/${P.steps.length} etapas concluídas. A etapa manual "${s.name}" (${s.laneName}) está aguardando conclusão — em campo seria o técnico.`,
    [{l:`Concluir "${s.name}"`,f:()=>{completarManual(s.id); agSay(`"${s.name}" concluída; a orquestração continua.`,[]); setTimeout(agAndamento,2000);},pri:true},
     {l:'Concluir a orquestração',f:agConcluirPlano},
     {l:'Ver o plano',f:()=>{agClose();go('plan');agSay('Abri o plano de orquestração. Quando fechar, seguimos daqui.',agAtuais());}},
     {l:'Ainda não',f:agNext}]); return; }
  const rodando=P.steps.filter(s=>s.status==='In Progress');
  const espera=P.steps.filter(s=>s.status==='Not Started' && !s.deps.every(d=>P.steps.find(x=>x.id===d).status==='Completed'));
  const txt = rodando.length ? `em execução: ${rodando.map(s=>s.name).join(', ')}.`

    : 'as restantes já estão liberadas; seguindo.';

  setTimeout(planoTick,400);
}
