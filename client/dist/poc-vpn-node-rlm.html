<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VPN Node · Quote · Agentforce Revenue Management</title>
<style>
:root{--brand:#0176d3;--brand-d:#014486;--navy:#032d60;--bg:#f3f3f3;--bd:#e5e5e5;--bd2:#c9c9c9;--tx:#181818;--tx2:#444;--mut:#706e6b;
--err:#ba0517;--warn:#fe9339;--warnt:#8c4b02;--ok:#2e844a;--path-band:#c9d7ea}
*{box-sizing:border-box}
body{margin:0;font-family:"Salesforce Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px;color:var(--tx);background:var(--bg)}
button,select,input{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
/* ---------- barra do protótipo (fora do Salesforce) ---------- */
#poc{background:#16325c;color:#cfe0f5;display:flex;align-items:center;gap:14px;padding:6px 12px;font-size:11.5px;flex-wrap:wrap}
#poc b{color:#9fc3ee;letter-spacing:.08em;text-transform:uppercase;font-size:10px}
#poc label{display:flex;flex-direction:column;gap:2px;font-size:10px}
#poc select{background:#fff;color:#181818;border:0;border-radius:3px;padding:3px 6px;font-size:12px;max-width:280px}
#poc .sp{flex:1}
#poc button{background:transparent;border:1px solid #6d8cc0;color:#fff;border-radius:4px;padding:4px 10px;font-size:11.5px;cursor:pointer}
/* ---------- Lightning chrome ---------- */
.gh{background:#fff;height:50px;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--bd)}
.gh .logo{width:40px;height:28px;border-radius:14px;background:#00a1e0;color:#fff;font-weight:700;font-size:11px;display:grid;place-items:center}
.gh .search{flex:1;max-width:560px;margin:0 auto;border:1px solid var(--bd2);border-radius:4px;padding:6px 12px;color:var(--mut);font-size:13px}
.gh .icons{display:flex;gap:14px;color:var(--mut);font-size:16px}
.nav{background:#fff;display:flex;align-items:center;padding:0 16px;height:40px;border-bottom:3px solid var(--brand);box-shadow:0 2px 2px rgba(0,0,0,.05)}
.nav .app{font-size:16px;font-weight:600;margin-right:24px;display:flex;align-items:center;gap:10px}
.nav .app i{width:16px;height:16px;display:grid;grid-template-columns:repeat(3,4px);gap:2px}
.nav .app i b{width:4px;height:4px;background:#706e6b;border-radius:50%}
.nav a{padding:10px 12px;color:var(--tx);border-bottom:3px solid transparent;margin-bottom:-3px}
.nav a.on{border-color:var(--brand);font-weight:600}
main{padding:12px 12px 40px}
/* ---------- record page ---------- */
.rec-h{background:#fff;border:1px solid var(--bd);border-radius:4px;box-shadow:0 2px 2px rgba(0,0,0,.05)}
.rec-top{display:flex;align-items:center;gap:12px;padding:14px 16px}
.rec-ic{width:36px;height:36px;border-radius:4px;background:#2e844a;display:grid;place-items:center;color:#fff;font-size:18px}
.rec-t small{display:block;font-size:12px;color:var(--tx2)}
.rec-t h1{margin:0;font-size:18px;font-weight:700}
.rec-acts{margin-left:auto;display:flex;gap:1px}
.rec-acts .btn{border-radius:0}
.rec-acts .btn:first-child{border-radius:4px 0 0 4px}
.rec-acts .btn:last-child{border-radius:0 4px 4px 0}
.hl{display:flex;gap:44px;padding:4px 16px 16px;flex-wrap:wrap}
.hl div small{display:block;color:var(--tx2);font-size:12px;margin-bottom:2px}
.hl div span{font-size:13px}
.hl .chk{width:14px;height:14px;border:1px solid var(--bd2);border-radius:2px;display:inline-block;background:#fff}
.path-wrap{background:#fff;border:1px solid var(--bd);border-radius:4px;margin-top:12px;overflow:hidden}
.path{display:flex;align-items:center;gap:8px;padding:12px 12px}
.steps{display:flex;flex:1;gap:2px}
.step{flex:1;position:relative;background:#f3f3f3;color:var(--tx);font-size:13px;text-align:center;padding:8px 4px 8px 14px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%)}
.step:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);border-radius:16px 0 0 16px}
.step.cur{background:var(--navy);color:#fff;font-weight:600}
.step:last-child{border-radius:0 16px 16px 0;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,12px 50%)}
.path .btn.brand{white-space:nowrap}
.path-band{height:24px;background:var(--path-band);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 6px,transparent 6px 18px)}
.tabs{display:flex;gap:4px;padding:0 12px;background:#fff;border-bottom:1px solid var(--bd)}
.tabs a{padding:12px 12px;color:var(--tx);border-bottom:3px solid transparent;margin-bottom:-1px;font-size:14px}
.tabs a.on{border-color:var(--brand);font-weight:700}
.card{background:#fff;border:1px solid var(--bd);border-radius:4px;box-shadow:0 2px 2px rgba(0,0,0,.05)}
.tle-h{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.tle-h .ic{width:32px;height:32px;border-radius:4px;background:#f4592f;color:#fff;display:grid;place-items:center;font-size:16px}
.tle-h h2{margin:0;font-size:15px;font-weight:700;flex:1}
.tle-h .tools{display:flex;align-items:center;gap:10px}
.tle-h .search{border:1px solid var(--bd2);border-radius:4px;padding:6px 10px;color:var(--mut);min-width:170px;font-size:12px}
.tog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx2)}
.tog .sw{position:relative;width:40px;height:22px;border-radius:11px;background:#8c8c8c;cursor:pointer;flex:none}
.tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.tog.on .sw{background:var(--brand)}
.tog.on .sw::after{left:20px}
.tog.on .sw::before{content:"✓";position:absolute;left:7px;top:2px;color:#fff;font-size:12px}
.tog small{display:block;font-size:10px;color:var(--mut);text-align:center}
.tog .lbl{display:flex;flex-direction:column;align-items:center}
.btn{border:1px solid var(--bd2);background:#fff;color:var(--brand);border-radius:4px;padding:6px 14px;font-size:13px;cursor:pointer;line-height:1.3}
.btn:hover{background:#f3f3f3}
.btn.brand{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.brand:hover{background:var(--brand-d)}
.btn[disabled]{background:#c9c9c9;border-color:#c9c9c9;color:#fff;cursor:not-allowed}
.btn.icon{width:32px;height:32px;padding:0;display:grid;place-items:center;color:var(--mut)}
/* ---------- TLE grid ---------- */
.grid-wrap{overflow-x:auto;border-top:1px solid var(--bd)}
table.tle{border-collapse:collapse;min-width:1480px;width:100%;font-size:12px}
.tle th{background:#fafaf9;color:var(--tx);font-weight:400;text-align:left;padding:8px 8px;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:78px;position:relative}
.tle th .v{position:absolute;right:6px;color:var(--mut);font-size:10px}
.tle th.f{max-width:none}
.tle td{padding:7px 8px;border-bottom:1px solid var(--bd);border-right:1px solid #f0f0f0;white-space:nowrap;vertical-align:middle}
.tle td.n{text-align:right}
.tle td .lnk{color:var(--brand);border-bottom:1px dotted var(--brand)}
.tle tr.child td:nth-child(3){padding-left:34px}
.tle .cb{width:14px;height:14px;border:1px solid var(--bd2);border-radius:2px;display:inline-block;vertical-align:middle;background:#fff}
.tle .act{width:24px;height:22px;border:1px solid var(--bd2);border-radius:4px;background:#fff;color:var(--brand);font-size:10px;cursor:pointer}
.tle .exp{border:0;background:0;color:var(--mut);cursor:pointer;width:16px}
.menu{position:absolute;background:#fff;border:1px solid var(--bd2);border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.2);min-width:110px;z-index:30}
.menu div{padding:8px 14px;cursor:pointer}
.menu div:hover{background:#f3f3f3}
.empty{padding:34px 16px;color:var(--mut);text-align:center;border-top:1px solid var(--bd)}
/* side panel */
.side{position:fixed;top:0;right:0;bottom:0;width:300px;background:#fff;border-left:1px solid var(--bd);box-shadow:-2px 0 8px rgba(0,0,0,.12);z-index:40;display:flex;flex-direction:column}
.side h3{margin:0;padding:12px 14px;border-bottom:1px solid var(--bd);font-size:15px;display:flex;align-items:center;gap:8px}
.side h3 button{margin-left:auto;background:0;border:0;color:var(--mut);cursor:pointer;font-size:16px}
.side .st{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--bd)}
.side .st a{padding:10px 10px;border-bottom:3px solid transparent;margin-bottom:-1px;color:var(--tx);cursor:pointer}
.side .st a.on{border-color:var(--brand);font-weight:700}
.side .sb{padding:12px 14px;overflow:auto;font-size:12.5px}
.side .img{height:110px;background:#f3f3f3;border-radius:4px;display:grid;place-items:center;font-size:36px;margin-bottom:12px}
.side dl{margin:0}.side dt{color:var(--mut);margin-top:8px}.side dd{margin:2px 0 0;font-weight:600}
.side details{border:1px solid var(--bd);border-radius:4px;margin-top:8px;padding:8px 10px;background:#fafaf9}
.side summary{font-weight:700;cursor:pointer}
/* ---------- modais ---------- */
.mbg{position:fixed;inset:0;background:rgba(8,7,7,.5);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:#fff;border-radius:4px;width:560px;max-width:94vw;box-shadow:0 2px 12px rgba(0,0,0,.35)}
.modal header{padding:16px;text-align:center;font-size:18px;font-weight:400;border-bottom:1px solid var(--bd);position:relative}
.modal header button{position:absolute;right:10px;top:10px;background:0;border:0;font-size:18px;color:var(--mut);cursor:pointer}
.modal .mb{padding:16px}
.modal footer{padding:12px 16px;border-top:1px solid var(--bd);background:#f3f3f3;display:flex;justify-content:flex-end;gap:8px;border-radius:0 0 4px 4px}
.radio{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--bd);border-radius:4px;margin-bottom:6px;cursor:pointer}
.radio input{accent-color:var(--brand)}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#2e844a;color:#fff;padding:12px 44px 12px 18px;border-radius:4px;z-index:60;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:14px}
.toast::before{content:"✓";position:absolute;left:-24px}
/* ---------- Browse Products ---------- */
.bp-top{background:#fff;border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;align-items:center;font-size:15px}
.bp-top b{font-weight:700;margin-right:6px}
.bp-top .nqli{margin-left:auto;color:var(--brand);font-size:13px}
.bp-head{background:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bd)}
.bp-head .ic{width:28px;height:28px;border-radius:4px;background:#2e844a;color:#fff;display:grid;place-items:center;font-size:14px}
.bp-head h2{margin:0;font-size:16px;flex:1}
.bp-head .search{border:1px solid var(--bd2);border-radius:4px;padding:7px 12px;color:var(--mut);min-width:230px}
.bp{display:grid;grid-template-columns:250px 1fr;min-height:560px;background:#fff}
.cats{border-right:1px solid var(--bd)}
.cats h3{margin:0;padding:16px 16px;font-size:14px;display:flex;gap:10px;align-items:center}
.cats h3 i{width:14px;height:14px;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.cats h3 i b{width:6px;height:6px;border-radius:2px;background:var(--brand)}
.cats a{display:block;padding:10px 16px;color:var(--tx);cursor:pointer}
.cats a.on{background:#e5f1fb}
.cats a.sub{padding-left:28px}
.bp-main{padding:16px 24px}
.bp-bar{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.bp-bar .all{display:flex;align-items:center;gap:8px;font-size:13px;flex:1}
.bp-bar .sel{color:var(--tx2);font-size:12px}
.prow{border:1px solid var(--bd);border-radius:4px;padding:16px;display:flex;gap:16px;align-items:center;margin-top:12px}
.prow .cb{width:14px;height:14px;border:1px solid var(--bd2);border-radius:2px;align-self:flex-start;background:#fff}
.prow .img{width:74px;height:60px;border-radius:4px;background:#f3f3f3;display:grid;place-items:center;font-size:28px;flex:none}
.prow .b{flex:1}
.prow .b .nm{font-size:15px}
.prow .b .pr{font-weight:700;margin:4px 0;display:flex;align-items:center;gap:8px}
.prow .b .pr .bo{width:18px;height:18px;border:1px solid var(--bd2);border-radius:4px;display:grid;place-items:center;font-size:10px;color:var(--mut);cursor:pointer}
.prow .b .ds{color:var(--tx2);font-size:12.5px}
.prow .qty{display:flex;align-items:center;border:1px solid var(--bd2);border-radius:4px;height:32px}
.prow .qty button{border:0;background:0;width:30px;color:var(--mut);cursor:pointer;font-size:14px}
.prow .qty span{width:34px;text-align:center}
.bp-foot{background:#f3f3f3;border-top:1px solid var(--bd);padding:10px 16px;display:flex;justify-content:space-between;position:sticky;bottom:0}
/* ---------- Product Configurator ---------- */
.cfg-top{background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:12px 24px;gap:28px}
.cfg-top h1{margin:0;font-size:18px;font-weight:400;flex:1}
.cfg-top .tog{gap:10px}
.cfg-top .fav{display:flex;border:1px solid var(--bd2);border-radius:4px}
.cfg-top .fav span{padding:6px 8px;color:var(--mut)}
.cfg-info{background:#f3f3f3;padding:12px 24px;font-size:13px;color:var(--tx)}
.mtabs{background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:8px 24px}
.mtabs .chev{color:var(--mut);cursor:pointer;width:16px}
.mtabs .pill{display:flex;align-items:center;gap:8px;padding:6px 14px;border:1px solid transparent;border-radius:4px;cursor:pointer;color:var(--tx)}
.mtabs .pill.on{border-color:var(--brand);font-weight:700;color:var(--brand-d)}
.mtabs .pill i{font-style:normal;font-weight:700}
.mtabs .pill.e i{color:var(--err)}.mtabs .pill.w i{color:var(--warn)}.mtabs .pill.i i{color:var(--brand)}
.mlist{background:#fff;border-bottom:1px solid var(--bd)}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 24px;border-bottom:1px solid #f0f0f0;font-size:13px}
.mrow i{font-style:normal;font-weight:700;width:16px;text-align:center}
.mrow.Error i{color:var(--err)}.mrow.Warning i{color:var(--warn)}.mrow.Info i{color:var(--brand)}
.mrow a{margin-left:auto;cursor:pointer}
.cfg{display:grid;grid-template-columns:1fr 480px;gap:0;background:#fff;min-height:520px}
.cfg-l{padding:16px 24px;border-right:1px solid var(--bd)}
.cfg-l .ret{display:block;margin-bottom:10px}
.ph{display:flex;gap:16px;align-items:flex-start}
.ph .img{width:154px;height:104px;border-radius:2px;background:linear-gradient(135deg,#e5f1fb,#cfe3f7);display:grid;place-items:center;font-size:40px;flex:none}
.ph .t{flex:1}.ph .t b{font-size:16px;display:block;margin-bottom:6px}.ph .t p{margin:0;color:var(--tx2);line-height:1.5}
.ph .pr{text-align:right}.ph .pr b{font-size:16px;display:block}.ph .pr small{color:var(--tx2)}
.qty-r{display:flex;justify-content:flex-end;margin:22px 0 10px}
.qty-r label{display:block;font-size:12px;color:var(--tx2);margin-bottom:4px}
.qty-r input{width:86px;border:1px solid var(--bd2);border-radius:4px;padding:6px 10px}
.atabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-top:14px}
.atabs a{padding:8px 12px;color:var(--tx);border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.atabs a.on{border-color:var(--brand);font-weight:700}
.fld{margin:14px 0 0}
.fld label{display:block;font-size:12px;color:var(--tx2);margin-bottom:4px}
.fld label .req{color:var(--err);margin-right:2px}
.fld select,.fld input[type=text],.fld input[type=number],.fld input[type=date]{width:100%;border:1px solid var(--bd2);border-radius:4px;padding:7px 10px;background:#fff;min-height:32px;appearance:auto}
.fld select:disabled,.fld input:disabled{background:#f3f3f3;color:var(--mut)}
.fld.err select,.fld.err input{border-color:var(--err);box-shadow:0 0 0 1px var(--err) inset}
.fld .ferr{color:var(--err);font-size:12px;margin-top:4px}
.fld .cbx{display:flex;align-items:center;gap:8px;min-height:32px}
.fld .cbx input{width:14px;height:14px;accent-color:var(--brand)}
.fld .help{font-size:11px;color:var(--mut);margin-top:3px}
.grp{margin-top:22px}
.grp>h3{margin:0 0 10px;font-size:18px;font-weight:400;display:flex;align-items:center;gap:8px;cursor:pointer}
.grp>h3 .c{font-size:12px;color:var(--mut)}
.ccard{border:1px solid var(--bd2);border-radius:4px;margin-bottom:10px;padding:10px 12px}
.ccard.sel{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.ccard .row{display:flex;align-items:center;gap:12px}
.ccard .row input[type=checkbox]{width:14px;height:14px;accent-color:var(--brand)}
.ccard .row .nm{font-weight:700;display:flex;align-items:center;gap:6px}
.ccard .row .nm .pen{color:var(--brand);font-size:11px}
.ccard .row .sm{margin-left:auto;border:1px solid var(--bd2);border-radius:4px;padding:6px 8px;background:#fff;min-width:96px;font-size:12px;color:var(--tx)}
.ccard .row .q{border:1px solid var(--bd2);border-radius:4px;padding:6px 8px;background:#f3f3f3;width:52px;color:var(--mut);text-align:center}
.ccard .row .pr{min-width:90px;text-align:right;font-weight:600;color:var(--tx2)}
.ccard .row .gear{width:30px;height:30px;border:1px solid var(--bd2);border-radius:4px;background:#fff;color:var(--brand);cursor:pointer}
.ccard .row .ch{border:0;background:0;color:var(--brand);cursor:pointer;font-size:14px}
.ccard .ds{color:var(--tx2);font-size:12.5px;margin:8px 0 0 26px}
.ccard .cbody{margin:6px 0 0 26px}
.ccard .cbody .fld{margin-top:10px}
.cfg-r{padding:16px 20px;background:#fff}
.cfg-r h2{margin:0 0 12px;font-size:20px;font-weight:400;border-bottom:1px solid var(--bd);padding-bottom:10px}
.sum-p{font-weight:700;font-size:15px;margin:10px 0 8px}
.sum-box{background:#f3f3f3;border-radius:4px;padding:10px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:12.5px}
.sum-box small{display:block;color:var(--tx2);margin-bottom:2px}
.sum-box .r{text-align:right}.sum-box .c{text-align:center}
.sum-attrs{margin-top:12px}
.sum-attrs b{display:block;font-size:14px;margin-bottom:6px}
.sum-attrs div{padding:6px 0;border-bottom:1px solid var(--bd);font-size:12.5px}
.sum-attrs div span{font-weight:700;margin-right:6px}
.sum-sec{margin-top:14px}
.sum-sec>b{display:block;margin-bottom:6px;font-size:13px}
.sum-card{border:1px solid var(--bd);border-radius:4px;padding:8px 12px;margin-bottom:8px}
.sum-card .h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sum-card .h a{font-weight:700}
.sum-card .chip{background:#e5f1fb;color:var(--brand-d);border-radius:12px;padding:1px 10px;font-size:11px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum-card .kv{display:flex;justify-content:space-between;font-size:12px}
.sum-card .kv small{color:var(--tx2);display:block}
.sum-tot{margin-top:16px;border-top:1px solid var(--bd);padding-top:10px}
.sum-tot div{display:flex;justify-content:space-between;font-size:15px;font-weight:700;padding:4px 0}
.sum-tot div span:last-child{font-weight:400}
.cfg-foot{position:sticky;bottom:0;background:#f3f3f3;border-top:1px solid var(--bd);padding:10px 24px;display:flex;justify-content:flex-end;gap:8px;z-index:20}
[onclick],[onchange]{cursor:pointer}
.step.done{background:#2e844a;color:#fff}
.step.sel{outline:2px solid var(--brand);outline-offset:-2px}
.step{cursor:pointer}
.menu div.dis{color:#c9c9c9;cursor:not-allowed}
.menu .sep{height:1px;background:var(--bd);margin:4px 0}
.rel{border-top:1px solid var(--bd)}
.rel .tle-h .btn{margin-left:auto}
table.sf-t{width:100%;border-collapse:collapse;font-size:12.5px}
table.sf-t th{text-align:left;background:#fafaf9;color:var(--mut);font-weight:400;padding:8px;border-bottom:1px solid var(--bd)}
table.sf-t td{padding:8px;border-bottom:1px solid var(--bd)}
.pad{padding:10px 16px}

const _FN = {};
function evalExpr(expr, env){
  if(expr===true || expr===undefined) return true;
  try{ const f = _FN[expr] || (_FN[expr] = new Function('a','c','ctx','d','f','x','v','t','return ('+expr+');'));
        return f(env.a||{}, env.c||{}, CTX, env.d||{}, F, env.x||{}, env.v, env.t||{}); }
  catch(e){ return undefined; }
}
const vazio = v => v===undefined || v===null || v==='' || v===false;

/* resolve os atributos que o produto herda da classificação, com as sobrescritas */
function resolveAttrs(prod){
  const cls = CLASSES.find(c => c.code===prod.cls); if(!cls) return [];
  const out=[], seen=new Set();
  cls.cats.forEach(cc => {
    const cat = ATTR_CATS.find(x=>x.code===cc); if(!cat) return;
    cat.attrs.forEach(code => {
      if(seen.has(code) || !ATTRS[code]) return; seen.add(code);
      const d = ATTRS[code], o = (cls.over||{})[code] || {};
      out.push(Object.assign({}, d, o, { key:code, cat:cat.name, catCode:cat.code, camada:cat.camada, hidden:!!o.hidden }));
    });
  });
  return out;
}
function visibleAttrs(prod){ return resolveAttrs(prod).filter(a=>!a.hidden); }
function isConfigurable(prod){ return visibleAttrs(prod).length>0; }
function usoDoAtributo(code){ return CLASSES.filter(c => c.cats.some(cc => (ATTR_CATS.find(x=>x.code===cc)||{attrs:[]}).attrs.includes(code))); }
function classOf(prod){ return CLASSES.find(c=>c.code===prod.cls); }

/* Elegibilidade comercial do produto: regras de conta + território da localidade.
   Avaliada por item (por node), não pela cotação — RN-ELG-02. */
function qualificadoProduto(prod, loc){
  const hits = QUALIF.filter(q => evalExpr(q.quando, {})).slice();
  const ter = TERRITORIOS_PRODUTO[prod.id];
  const L = loc || CTX.localidade;
  if(ter && L && ter.indexOf(L.territorio) === -1)
    hits.push({ id:'RN-ELG-01', objeto:'ProductQualification (território)',
      motivo: prod.name+' não é elegível em '+L.nome+' — território '+L.territorio+'. Elegível em: '+ter.join(' e ')+'.' });
  return { ok:hits.length===0, hits };
}

function classificar(cfg){
  const e = CTX.endereco, env = { a:cfg.a, c:cfg.c };
  if(e.cobertura===false || e.redeNeutra) return { v:'Inviável', motivos:[e.cobertura===false?'Sem cobertura no endereço':'Rede neutra'] };
  const mot = CLASSIF.customizacao.filter(([x]) => evalExpr(x, env)).map(x=>x[1]);
  if(mot.length) return { v:'Customizado', motivos:mot };
  if(!cfg.a.Velocidade || !cfg.a.Tecnologia) return { v:'Pendente', motivos:['Informe a velocidade para classificar o atendimento'] };
  const m = CLASSIF.matriz.find(([x]) => evalExpr(x, env));
  return m ? { v:'Formatado', motivos:[m[1]] } : { v:'Customizado', motivos:['Nenhum critério da matriz de formatação atendido'] };
}
function resolveRef(cfg, key){
  if(key.includes('#')){ const [cp, rest] = key.split('#'); const [i, attr] = rest.split('.'); return [(cfg.c[cp]||[])[Number(i)], attr]; }
  return [cfg.a, key];
}
function avaliar(cfg){
  const R = { hidden:{}, disabled:{}, required:{}, hideVals:{}, msgs:[], excl:{}, ferr:{} };
  for(let pass=0; pass<2; pass++){
    const d = { classificacao: classificar(cfg).v };
    REGRAS.forEach(r => r.efeitos.forEach(e => {
      if(e.tipo==='setValue' && !e.componente && evalExpr(e.quando, {a:cfg.a,c:cfg.c,d})){
        const val = evalExpr(e.valor, {a:cfg.a,c:cfg.c,d}); if(val===undefined||val===null) return;
        if(e.forcar || (e.soVazio ? vazio(cfg.a[e.alvo]) : !cfg.toque[e.alvo])) cfg.a[e.alvo] = val;
      }
      if(e.tipo==='autoAdd' && evalExpr(e.quando, {a:cfg.a,c:cfg.c,d})){
        const sig = (cfg.a.Tecnologia||'')+'|'+(CTX.endereco.anel?1:0);
        if(cfg.autoSig !== sig){ const itens = evalExpr(e.itens, {a:cfg.a,c:cfg.c,d}) || [];
          cfg.c[e.componente] = (cfg.c[e.componente]||[]).filter(i=>!i.auto).concat(itens); cfg.autoSig = sig; }
      }
    }));
  }
  const cls = classificar(cfg); R.cls = cls; const d = { classificacao: cls.v };
  const t = { nodesNovaNetwork: lines.filter(l => l.attrs && l.attrs['VPN Network']==='NOVA').length + (cfg.a.VPNNetwork==='NOVA'?1:0) };
  REGRAS.forEach(r => r.efeitos.forEach(e => {
    const alvos = e.componente ? (cfg.c[e.componente]||[]).map((x,i)=>({key:e.componente+'#'+i+'.'+e.alvo, x}))
                               : [{ key:e.alvo, x:{} }];
    alvos.forEach(({key,x}) => {
      const env = { a:cfg.a, c:cfg.c, d, x, t };
      if(!evalExpr(e.quando, env)) return;
      if(e.tipo==='hide') R.hidden[key]=r.id;
      else if(e.tipo==='disable') R.disabled[key]=r.id;
      else if(e.tipo==='require') R.required[key]=r.id;
      else if(e.tipo==='hideValues'){ const at=ATTRS[e.alvo]; (at? at.values:[]||[]).forEach(v => {
          if(evalExpr(e.filtro, Object.assign({}, env, {v}))) (R.hideVals[key]=R.hideVals[key]||{})[v]=r.id; }); }
      else if(e.tipo==='message'){ if(!e.componente || (cfg.c[e.componente]||[]).length) R.msgs.push({sev:e.severidade, texto:e.texto, regra:r.id}); }
      else if(e.tipo==='constraint'){ R.ferr[key]=e.texto; R.msgs.push({sev:e.severidade||'Error', texto:e.texto, regra:r.id}); }
      else if(e.tipo==='exclude'){ R.excl[e.componente]={texto:e.texto, regra:r.id};
        if((cfg.c[e.componente]||[]).length) R.msgs.push({sev:'Error', texto:e.texto, regra:r.id}); }
      else if(e.tipo==='transacao') R.msgs.push({sev:e.severidade, texto:e.texto, regra:r.id});
    });
  }));
  Object.entries(R.hideVals).forEach(([key,vals]) => { const [obj,attr]=resolveRef(cfg,key); if(obj && vals[obj[attr]]) obj[attr]=''; });
  Object.keys(R.required).forEach(key => {
    if(R.hidden[key]) return; const [obj,attr]=resolveRef(cfg,key); if(!obj) return;
    if(vazio(obj[attr])){ R.ferr[key]=R.ferr[key]||'Preencha este campo.';
      R.msgs.push({sev:'Error', texto:'Atributo obrigatório sem valor: '+(ATTRS[attr]?ATTRS[attr].name:attr), regra:R.required[key]}); }
  });
  const seen=new Set(); R.msgs = R.msgs.filter(m => { const k=m.sev+m.texto; if(seen.has(k)) return false; seen.add(k); return true; });
  const ord={Error:0,Warning:1,Info:2}; R.msgs.sort((a,b)=>ord[a.sev]-ord[b.sev]);
  return R;
}

/* ---------- linha de cotação ---------- */
function addLine(p, cfg, R){
  lineSeq++;
  const attrs = {};
  if(cfg){ cfg.defs.filter(a=>!a.hidden && !R.hidden[a.key] && !vazio(cfg.a[a.key])).forEach(a => attrs[a.name] = cfg.a[a.key]===true?'Sim':cfg.a[a.key]); }
  attrs['Localidade'] = CTX.localidade.nome + ' · ' + CTX.localidade.territorio;
  attrs['Endereço de instalação'] = CTX.endereco.nome;
  attrs['Entidade faturadora'] = entidadeFaturadora().valor;
  const line = { uid:'L'+lineSeq, id:p.id, name:p.name, sell:p.sell, qty:(S.qtd[p.id]||1), parent:true, attrs, classif:R?R.cls.v:'', loc:CTX.localidade.id,
                 end:endFull().id, viabOk: !!S.viab[endFull().id], configured: !!cfg, errors: R ? R.msgs.filter(m=>m.sev==='Error').length : 0, expanded:true };
  lines.push(line);
  if(cfg){
    (p.groups||[]).flatMap(g=>g.produtos).forEach(pid => (cfg.c[compKey(pid)]||[]).forEach(x => {
      const cp = findProd(pid), at = {}; resolveAttrs(cp).forEach(a => { if(!vazio(x[a.key])) at[a.name] = x[a.key]; });
      lineSeq++; lines.push({ uid:'L'+lineSeq, id:cp.id, name:(x.TipoEquipamento||cp.name), sell:cp.sell, qty:1, parent:false, parentUid:line.uid, attrs:at });
    }));
  }
  return line;
}

/* ---------- Product Configurator ---------- */
function novoCfg(p){
  const cfg = { prod:p, defs:resolveAttrs(p), a:{}, c:{}, toque:{}, autoSig:null };
  cfg.defs.forEach(a => { if(a.def) cfg.a[a.key]=a.def; if(a.ui==='checkbox') cfg.a[a.key]=false; });
  (p.groups||[]).forEach(g => g.produtos.forEach(pid => cfg.c[compKey(pid)] = []));
  return cfg;
}
function openConfig(id, uid){
  const p = findProd(id);
  const qp = qualificadoProduto(p);
  if(!qp.ok){ toast(qp.hits[qp.hits.length-1].motivo); return; }
  cfgProduct = novoCfg(p); cfgProduct.uid = uid || null;
  if(uid){ const l = lines.find(x=>x.uid===uid); if(l && l.cfgState){ cfgProduct.a = JSON.parse(JSON.stringify(l.cfgState.a)); cfgProduct.c = JSON.parse(JSON.stringify(l.cfgState.c)); cfgProduct.toque = Object.assign({}, l.cfgState.toque); cfgProduct.autoSig = l.cfgState.autoSig; } }

function field(a, R, obj, key){
  const attr = key.includes('#') ? key.split('.').pop() : a.key;
  const val = obj[attr], dis = R.disabled[key]||a.ro, req = R.required[key], er = S.validacao && R.ferr[key];
  const hv = R.hideVals[key]||{};
  let ctl;
  if(a.ui==='picklist') ctl = `<select ${dis?'disabled':''} onchange="setAttr('${key}',this.value)"><option value="">--None--</option>${a.values.filter(v=>!hv[v]).map(v=>`<option ${val===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`;
  else if(a.ui==='checkbox') ctl = `<div class="cbx"><input type="checkbox" ${val?'checked':''} ${dis?'disabled':''} onchange="setAttr('${key}',this.checked)"><span>${esc(a.values[0]||'Sim')}</span></div>`;
  else if(a.ui==='network'){ const nets = CTX_DATA.networks[CTX.conta.cnpjRaiz]||[];
    ctl = `<select onchange="setAttr('${key}',this.value)"><option value="">--None--</option>${nets.map(n=>`<option value="${n.id}" ${val===n.id?'selected':''}>${esc(n.id+' · '+n.nome)}</option>`).join('')}<option value="NOVA" ${val==='NOVA'?'selected':''}>+ Criar nova VPN Network</option></select>`; }
  else { const type=(a.ui==='number'||a.ui==='currency')?'number':(a.ui==='date'&&!dis)?'date':'text';
    ctl = `<input type="${type}" value="${val==null?'':esc(val)}" ${dis?'disabled':''} onchange="setAttr('${key}',this.value)">`; }

  }

    <div class="fl-prog"><span class="${f.step>=1?'on':''}">1 Itens</span><span class="${f.step>=2?'on':''}">2 Consulta</span><span class="${f.step>=3?'on':''}">3 Resultado</span></div>

function runViab(){
  if(!S.flow || S.flow.step!==2) return;
  const sel = lines.filter(l=>l.parent && S.flow.sel[l.uid]);
  S.flow.result = sel.map(l => ({ uid:l.uid, name:l.name, end: CTX_DATA.enderecos.find(x=>x.id===l.end) }));
  S.flow.step = 3; render();
}
function finishViab(){
  S.flow.result.forEach(r => {
    S.viab[r.end.id] = true;
    const l = lines.find(x=>x.uid===r.uid); if(!l) return;
    // reavalia a configuração salva com o retorno da viabilidade (regras preenchem tecnologia, interface, abordagem, equipamentos)
    const p = findProd(l.id); const cfg = novoCfg(p);
    if(l.cfgState){ cfg.a = JSON.parse(JSON.stringify(l.cfgState.a)); cfg.c = JSON.parse(JSON.stringify(l.cfgState.c)); cfg.toque = Object.assign({}, l.cfgState.toque); }
    ['Tecnologia','Interface','Abordagem','Metragem'].forEach(k=>delete cfg.toque[k]); cfg.autoSig = null;
    const keepEnd = CTX.endId; CTX.endId = r.end.id; CTX.endereco = endEff();
    const R = avaliar(cfg);
    lines = lines.filter(x=>x.uid!==l.uid && x.parentUid!==l.uid);
    const nl = addLine(p, cfg, R); nl.cfgState = { a:cfg.a, c:cfg.c, toque:cfg.toque, autoSig:cfg.autoSig }; nl.viabOk = true;
    CTX.endId = keepEnd; CTX.endereco = endEff();
  });
  S.flow = null; toast('Viabilidade técnica registrada nos itens da cotação.'); render();
}

    genContractDoc(); ok('Generate Document cria o documento do contrato', S.contract.docs.length===1);
    S.modal='esig'; render(); ok('Send for eSignature: fornecedor DocuSign, template e destinatários', $('.modal').textContent.includes('DocuSign') && $('#esig-to'));
    sendEsig(); ok('envelope enviado: contrato em aprovação, destinatários Sent', S.contract.esig==='Sent' && S.contract.recipients.length===2 && S.contract.recipients.every(r=>r.status==='Sent'));
    simularAssinatura(); ok('assinatura concluída: contrato Activated, documento Completed', S.contract.status==='Activated' && S.contract.docs[0].sig==='Completed');
    S.tela='quote'; render(); S.selStep='Accepted'; render();
    ok('path: selecionar Accepted troca o botão para Mark as Current Status', $('.path .btn').textContent.includes('Mark as Current Status'));
    setQuoteStatus(); ok('cotação Accepted com etapas anteriores marcadas', S.status==='Accepted' && document.querySelectorAll('.step.done').length===6);
    hdrMenu({stopPropagation(){}, clientX:900, clientY:100}); ok('Create Order habilitado após Accepted', ![...document.querySelectorAll('.menu div')].find(d=>d.textContent==='Create Order').classList.contains('dis'));
    S.menu=null; S.modal='order'; render(); ok('Create Order: Create Single Order + Finish', $('.modal').textContent.includes('Create Single Order') && $('.modal footer .brand').textContent==='Finish');
    createOrder(); ok('toast "Order 00000037 was created."', $('.toast') && $('.toast').textContent.includes('Order 00000037 was created'));
    S.tela='order'; render();
    ok('página do pedido: cabeçalho, path Draft/Activated, Order Products com as colunas da captura, Order Summary', $('.rec-t h1').textContent==='00000037' && document.querySelectorAll('.step').length===2 && [...document.querySelectorAll('table.tle th')].map(t=>t.textContent.replace('⌄','')).join('|').includes('Quantity|Net Unit Price|Discount|Net Total Price|Billing Frequency') && $('.osum'));
    ok('pedido carrega os itens da cotação com componentes', S.order.lines.filter(l=>l.parent).length===1 && S.order.lines.filter(l=>!l.parent).length===3);
    S.order.selStep='Activated'; render(); setOrderStatus();
    ok('Activated: status muda, Add Assets/Add Group bloqueados, assets criados', S.order.status==='Activated' && [...document.querySelectorAll('.tle-h .btn')].filter(b=>b.disabled).length>=2 && S.assets.length===1);
    S.tela='assets'; render();
    ok('aba Assets da conta: Managed Assets com Amend/Renew/Cancel e o VPN Node', $('.tle-h h2').textContent==='Managed Assets (1)' && $('.tle-h .tools').textContent.includes('Amend') && $('table.tle').textContent.includes('VPN Node'));
    S.tela='quote'; render();
    const t=document.getElementById('tst'); t.style.display='block';
    t.textContent=o.join('\n')+'\n\nRESUMO: '+o.filter(x=>x[0]==='P').length+' PASS / '+o.filter(x=>x[0]==='F').length+' FAIL';
  }catch(err){ const t=document.getElementById('tst'); t.style.display='block'; t.textContent=o.join('\n')+'\n\nERRO: '+err.message+'\n'+err.stack; }
}

</script>
</body>
</html>
